function SlotEditorModal({ slot, rinks, onSave, onDelete, onClose }) {
  const [draft, setDraft] = useState(() => ({
    rinkId: rinks[0]?.id || "", day: 1, start: "17:00", end: "21:00",
    note: "", blocked: false, blockLabel: "", ...slot,
  }));
  const [err, setErr] = useState("");
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const submit = () => {
    if (!draft.rinkId) return setErr("Pick a rink.");
    if (toMin(draft.end) <= toMin(draft.start)) return setErr("End has to be after start.");
    onSave({ ...draft, id: draft.id || uid("sl") });
  };
  const len = toMin(draft.end) - toMin(draft.start);
  return (
    <Modal title={slot?.id ? "Edit rink window" : "Add rink window"} width={460} onClose={onClose}
      footer={<>
        {slot?.id && <button onClick={() => onDelete(slot.id)} style={dangerBtn()}>Delete</button>}
        <div style={{ flex: 1 }} />
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button onClick={submit} style={primaryBtn()}>Save</button>
      </>}>
      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Rink" style={{ flex: 1 }}>
          <select value={draft.rinkId} onChange={e => set("rinkId", e.target.value)} style={{ ...inputStyle, width: "100%" }}>
            {rinks.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
          </select>
        </Field>
        <Field label="Day" style={{ flex: 1 }}>
          <select value={draft.day} onChange={e => set("day", Number(e.target.value))} style={{ ...inputStyle, width: "100%" }}>
            {DAYS.map(d => <option key={d} value={d}>{DOW_LONG[d]}</option>)}
          </select>
        </Field>
      </div>
      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Ice available from" style={{ flex: 1 }}>
          <input type="time" step={900} value={draft.start} onChange={e => set("start", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
        <Field label="Until" style={{ flex: 1 }}>
          <input type="time" step={900} value={draft.end} onChange={e => set("end", e.target.value)} style={{ ...inputStyle, width: "100%" }} />
        </Field>
      </div>
      {len > 0 && <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 12 }}>{fmtDur(len)} of ice.</div>}
      <Field label="Note" hint='Date caveats live here as text — e.g. "*Oct 13" or "starts Sept 15".'>
        <input value={draft.note || ""} onChange={e => set("note", e.target.value)} placeholder="*Oct 13" style={{ ...inputStyle, width: "100%" }} />
      </Field>
      <label style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 13, color: C.text, cursor: "pointer" }}>
        <input type="checkbox" checked={!!draft.blocked} onChange={e => set("blocked", e.target.checked)} />
        <span>Blocked — reserved for something else, don't schedule teams here</span>
      </label>
      {draft.blocked && (
        <Field label="Blocked for" style={{ marginTop: 10 }}>
          <input value={draft.blockLabel || ""} onChange={e => set("blockLabel", e.target.value)} placeholder="tournament, public skate…" style={{ ...inputStyle, width: "100%" }} />
        </Field>
      )}
      {err && <div style={{ marginTop: 10, fontSize: 12, color: C.redText }}>{err}</div>}
    </Modal>
  );
}

function IceTab({ slots, setSlots, assignments, rinks }) {
  const [editing, setEditing] = useState(null);
  const rinkMap = useMemo(() => Object.fromEntries(rinks.map(r => [r.id, r])), [rinks]);

  const totals = useMemo(() => {
    let total = 0, booked = 0, blocked = 0;
    for (const s of slots) {
      const len = toMin(s.end) - toMin(s.start);
      if (s.blocked) { blocked += len; continue; }
      total += len;
      booked += slotUtilization(s, assignments).booked;
    }
    return { total, booked, blocked, open: total - booked };
  }, [slots, assignments]);

  const saveSlot = s => {
    setSlots(prev => prev.some(x => x.id === s.id) ? prev.map(x => x.id === s.id ? s : x) : [...prev, s]);
    setEditing(null);
  };

  return (
    <div>
      <SectionCard
        title="Ice available each week"
        subtitle="The repeating pattern of ice the association holds. Teams can only be scheduled inside these windows."
        right={<button onClick={() => setEditing({})} style={primaryBtn()}>Add window</button>}
        pad={0}
      >
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap", padding: "11px 16px", borderBottom: `1px solid ${C.borderLight}`, fontSize: 12, color: C.textMuted }}>
          <span><strong style={{ color: C.text }}>{fmtDur(totals.total)}</strong> a week</span>
          <span><strong style={{ color: C.text }}>{totals.total ? Math.round(totals.booked / totals.total * 100) : 0}%</strong> allocated</span>
          <span><strong style={{ color: C.text }}>{fmtDur(totals.open)}</strong> open</span>
          {totals.blocked > 0 && <span><strong style={{ color: C.orangeText }}>{fmtDur(totals.blocked)}</strong> blocked</span>}
        </div>

        {DAYS.map(day => {
          const mine = slots.filter(s => s.day === day).sort((a, b) => toMin(a.start) - toMin(b.start));
          return (
            <div key={day}>
              <div style={{ padding: "6px 16px", background: C.surfaceAlt, fontSize: 11, fontWeight: 700, color: C.textMuted, borderBottom: `1px solid ${C.borderLight}`, display: "flex", alignItems: "center", gap: 8 }}>
                {DOW_LONG[day]}
                {!mine.length && <span style={{ fontWeight: 500, color: C.textLight }}>— no ice</span>}
              </div>
              {mine.map(s => {
                const u = slotUtilization(s, assignments);
                const pct = u.total ? u.booked / u.total : 0;
                return (
                  <div key={s.id} onClick={() => setEditing(s)} style={{
                    padding: "9px 16px", borderBottom: `1px solid ${C.borderLight}`,
                    display: "flex", alignItems: "center", gap: 10, cursor: "pointer", flexWrap: "wrap",
                  }}>
                    <span style={{ fontSize: 13, fontWeight: 600, minWidth: 84 }}>{rinkMap[s.rinkId]?.short || "?"}</span>
                    <span style={{ fontSize: 13, color: C.textMuted }}>{fmtRange(toMin(s.start), toMin(s.end))}</span>
                    {s.note && <span style={{ fontSize: 11, color: C.blueText, fontWeight: 600 }}>{s.note}</span>}
                    {s.blocked && <span style={{ fontSize: 11, fontWeight: 700, color: C.orangeText }}>BLOCKED{s.blockLabel ? ` — ${s.blockLabel}` : ""}</span>}
                    {!s.blocked && (
                      <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8, fontSize: 11, color: C.textMuted }}>
                        <span style={{ width: 70, height: 6, background: C.borderLight, borderRadius: 3, overflow: "hidden" }}>
                          <span style={{ display: "block", height: 6, width: `${Math.round(pct * 100)}%`, background: pct > 0.85 ? C.green : C.accent }} />
                        </span>
                        {u.free > 0 ? `${fmtDur(u.free)} open` : "full"}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })}
      </SectionCard>

      {editing && (
        <SlotEditorModal slot={editing} rinks={rinks} onSave={saveSlot}
          onDelete={id => { setSlots(prev => prev.filter(s => s.id !== id)); setEditing(null); }}
          onClose={() => setEditing(null)} />
      )}
    </div>
  );
}

// ══════════════════════════════════════════════════
// TAB 3 — FILL
// Not "generate the season". This is the answer to "I found a conflict and
// now I have to rejig everything by hand": say who still needs ice, and it
// works out where it fits around what's already there.
// ══════════════════════════════════════════════════
function FillTab({ teams, rinks, slots, assignments, rules, onFill, lastResult }) {
  const [want, setWant] = useState({});
  const [rebuild, setRebuild] = useState(false);

  const teamMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const have = useMemo(() => {
    const m = {};
    for (const a of assignments) for (const tid of a.teamIds || []) m[tid] = (m[tid] || 0) + 1;
    return m;
  }, [assignments]);

  // Default ask: the shortfall against each team's weekly target.
  const askFor = t => {
    if (want[t.id] !== undefined) return want[t.id];
    return rebuild ? (t.sessionsPerWeek || 0) : Math.max(0, (t.sessionsPerWeek || 0) - (have[t.id] || 0));
  };
  const totalAsk = teams.reduce((n, t) => n + askFor(t), 0);

  const openIce = useMemo(() => {
    let open = 0;
    for (const s of slots) {
      if (s.blocked) continue;
      open += rebuild ? toMin(s.end) - toMin(s.start) : slotUtilization(s, assignments).free;
    }
    return open;
  }, [slots, assignments, rebuild]);

  const askedMinutes = teams.reduce((n, t) => n + askFor(t) * ruleFor(rules, t.ageGroup).durationMin, 0);
  const tight = askedMinutes > openIce;

  const byLevel = useMemo(() => {
    const m = {};
    for (const t of teams) (m[t.level] = m[t.level] || []).push(t);
    return m;
  }, [teams]);

  return (
    <div>
      <SectionCard title="Fill the open ice"
        subtitle="Works out where the remaining ice times fit, around everything already on the board.">
        <div style={{ fontSize: 13, color: C.text, lineHeight: 1.6, marginBottom: 14 }}>
          It won't move anything you've already placed unless you ask it to. Age-group start windows, rink
          windows and double-bookings are hard limits — anything it can't fit comes back with the reason
          rather than being forced in.
        </div>
        <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 14 }}>
          {[
            { label: rebuild ? "Ice available" : "Ice still open", value: fmtDur(openIce), tone: C.text },
            { label: "Ice being asked for", value: fmtDur(askedMinutes), tone: tight ? C.redText : C.text },
            { label: "Ice times to place", value: String(totalAsk), tone: C.text },
          ].map(s => (
            <div key={s.label} style={{ flex: "1 1 130px" }}>
              <div style={{ fontSize: 11, color: C.textMuted, fontWeight: 600 }}>{s.label}</div>
              <div style={{ fontSize: 20, fontFamily: DISPLAY, fontWeight: 700, color: s.tone }}>{s.value}</div>
            </div>
          ))}
        </div>
        {tight && (
          <div style={{ background: C.redLight, border: `1px solid ${C.red}`, borderRadius: 8, padding: "10px 12px", fontSize: 12, color: C.redText, marginBottom: 12, lineHeight: 1.5 }}>
            More ice is being asked for than is open. Some teams will come up short — the shortfall gets spread
            rather than landing on one team, and everything unplaced is listed afterwards.
          </div>
        )}
        <label style={{ display: "flex", gap: 8, alignItems: "flex-start", fontSize: 13, color: C.text, cursor: "pointer", marginBottom: 14, lineHeight: 1.5 }}>
          <input type="checkbox" checked={rebuild} onChange={e => { setRebuild(e.target.checked); setWant({}); }} style={{ marginTop: 3 }} />
          <span>
            <strong>Start the week over.</strong> Clears every ice time and re-places all of them from scratch.
            Use this when the whole week needs re-jigging, not when you're filling a gap.
          </span>
        </label>
        <button
          onClick={() => onFill({
            rebuild,
            requests: teams.flatMap(t => Array.from({ length: askFor(t) }, () => ({ teamId: t.id, kind: "practice" }))),
          })}
          disabled={!totalAsk}
          style={{ ...primaryBtn(), width: "100%", padding: "13px 0", fontSize: 15, opacity: totalAsk ? 1 : 0.45, cursor: totalAsk ? "pointer" : "not-allowed" }}>
          {rebuild ? `Rebuild the week — ${totalAsk} ice times` : `Fill ${totalAsk} ice time${totalAsk === 1 ? "" : "s"}`}
        </button>
      </SectionCard>

      <SectionCard title="Who needs ice" subtitle="Defaults to each team's shortfall against its weekly target." pad={0}>
        {LEVELS.filter(l => byLevel[l]?.length).map(level => (
          <div key={level}>
            <div style={{ padding: "5px 16px", background: levelColor(level).bg, color: levelColor(level).text, fontSize: 11, fontWeight: 700 }}>{level}</div>
            {byLevel[level].map(t => {
              const n = askFor(t);
              const got = have[t.id] || 0;
              return (
                <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 16px", borderBottom: `1px solid ${C.borderLight}` }}>
                  <span style={{ fontSize: 13, fontWeight: 500, color: n === 0 ? C.textLight : C.text }}>{teamName(t)}</span>
                  <AgeChip ageGroup={t.ageGroup} />
                  <span style={{ fontSize: 11, color: C.textMuted, marginLeft: 4 }}>
                    has {got} of {t.sessionsPerWeek}
                  </span>
                  <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6 }}>
                    <button onClick={() => setWant(w => ({ ...w, [t.id]: clamp(n - 1, 0, 7) }))} style={{ ...smallBtn(), width: 28, padding: "5px 0" }}>−</button>
                    <span style={{ minWidth: 20, textAlign: "center", fontSize: 14, fontWeight: 700, color: n === 0 ? C.textLight : C.text }}>{n}</span>
                    <button onClick={() => setWant(w => ({ ...w, [t.id]: clamp(n + 1, 0, 7) }))} style={{ ...smallBtn(), width: 28, padding: "5px 0" }}>+</button>
                  </div>
                </div>
              );
            })}
          </div>
        ))}
        {Object.keys(want).length > 0 && (
          <div style={{ padding: 12 }}>
            <button onClick={() => setWant({})} style={smallBtn()}>Reset to targets</button>
          </div>
        )}
      </SectionCard>

      {lastResult && (
        <SectionCard title="Last run" subtitle={`${lastResult.placed} ice times on the board · best of ${lastResult.runs} attempts`}>
          {!lastResult.unplaced.length ? (
            <div style={{ fontSize: 13, color: C.greenText }}>Everything asked for was placed.</div>
          ) : (
            <div>
              <div style={{ fontSize: 13, color: C.redText, marginBottom: 8, fontWeight: 600 }}>
                {lastResult.unplaced.length} couldn't be placed:
              </div>
              {lastResult.unplaced.map((u, i) => (
                <div key={i} style={{ fontSize: 12, padding: "4px 0", borderBottom: `1px solid ${C.borderLight}` }}>
                  <strong>{u.teamName}</strong> — {u.reason}
                </div>
              ))}
              <div style={{ fontSize: 11, color: C.textMuted, marginTop: 10, lineHeight: 1.5 }}>
                Usually that means no open window overlaps that age group's start times. Buying earlier ice,
                widening the window on <strong>Teams &amp; Rules</strong>, or allowing shared ice are the three fixes.
              </div>
            </div>
          )}
        </SectionCard>
      )}
    </div>
  );
}

function RulesEditor({ rules, setRules }) {
  const [help, setHelp] = useState(false);
  const update = (band, path, value) => setRules(prev => {
    const next = { ...prev, [band]: { ...ruleFor(prev, band) } };
    if (path.length === 1) next[band][path[0]] = value;
    else next[band][path[0]] = { ...next[band][path[0]], [path[1]]: value };
    return next;
  });
  const cell = { ...tdStyle, textAlign: "center", padding: "6px" };
  const timeInput = { ...inputStyle, padding: "4px 6px", fontSize: 12, width: 112 };
  return (
    <SectionCard title="Age group rules" subtitle="Start windows the allocator treats as hard limits."
      right={<button onClick={() => setHelp(true)} style={{ ...smallBtn(), width: 28, padding: "5px 0" }}>?</button>} pad={0}>
      <div style={{ padding: "10px 16px", background: C.orangeLight, color: C.orangeText, fontSize: 12, lineHeight: 1.5, borderBottom: `1px solid ${C.borderLight}` }}>
        <strong>These are placeholders.</strong> They need the association's real numbers before any allocation
        should be trusted.
      </div>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 800 }}>
          <thead>
            <tr>
              <th style={{ ...thStyle, textAlign: "left" }}>Age</th>
              <th style={{ ...thStyle }}>Ice length</th>
              <th style={{ ...thStyle }}>Weeknight start</th>
              <th style={{ ...thStyle }}>Weekend start</th>
              <th style={{ ...thStyle }}>Max/day</th>
              <th style={{ ...thStyle }}>Cross-ice</th>
            </tr>
          </thead>
          <tbody>
            {AGE_GROUPS.map(a => {
              const r = ruleFor(rules, a.id);
              return (
                <tr key={a.id}>
                  <td style={{ ...tdStyle, textAlign: "left", fontWeight: 600, fontSize: 13 }}>{a.label}</td>
                  <td style={cell}>
                    <select value={r.durationMin} onChange={e => update(a.id, ["durationMin"], Number(e.target.value))} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12 }}>
                      {[30, 45, 50, 60, 75, 80, 90, 105, 120].map(n => <option key={n} value={n}>{fmtDur(n)}</option>)}
                    </select>
                  </td>
                  {["weekday", "weekend"].map(kind => (
                    <td key={kind} style={cell}>
                      <div style={{ display: "flex", gap: 4, alignItems: "center", justifyContent: "center" }}>
                        <input type="time" step={900} value={r[kind].earliest} onChange={e => update(a.id, [kind, "earliest"], e.target.value)} style={timeInput} />
                        <span style={{ color: C.textLight, fontSize: 11 }}>to</span>
                        <input type="time" step={900} value={r[kind].latest} onChange={e => update(a.id, [kind, "latest"], e.target.value)} style={timeInput} />
                      </div>
                    </td>
                  ))}
                  <td style={cell}>
                    <input type="number" min={1} max={3} value={r.maxPerDay ?? 1} onChange={e => update(a.id, ["maxPerDay"], clamp(Number(e.target.value) || 1, 1, 3))} style={{ ...inputStyle, padding: "4px 6px", fontSize: 12, width: 52, textAlign: "center" }} />
                  </td>
                  <td style={cell}>
                    <input type="checkbox" checked={!!r.allowShared} onChange={e => update(a.id, ["allowShared"], e.target.checked)} />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "10px 16px", fontSize: 11, color: C.textMuted, borderTop: `1px solid ${C.borderLight}`, lineHeight: 1.5 }}>
        Start windows are about when a team may <em>take</em> the ice. A U9 team with a 6:15p latest start can
        skate until 7:15p — it just can't be handed a 6:30p slot. Separately, <strong>{[...SHARE_LEVELS].join(", ")}</strong>{" "}
        teams may share a sheet with each other across age groups.
      </div>
      {help && (
        <Modal title="How the rules are used" width={480} onClose={() => setHelp(false)}
          footer={<><div style={{ flex: 1 }} /><button onClick={() => setHelp(false)} style={primaryBtn()}>Got it</button></>}>
          <div style={{ fontSize: 13, lineHeight: 1.6 }}>
            <p style={{ marginBottom: 10 }}><strong>Ice length</strong> — how long one ice time runs for this band.</p>
            <p style={{ marginBottom: 10 }}><strong>Start windows</strong> — the earliest and latest a team may be scheduled to <em>start</em>, separately for weeknights and weekends. The allocator leaves a request unplaced rather than break one.</p>
            <p style={{ marginBottom: 10 }}><strong>Max/day</strong> — how many ice times one team can get on the same day.</p>
            <p style={{ marginBottom: 10 }}><strong>Cross-ice</strong> — whether two teams in this band can share one sheet. House-league teams can also share with each other across age groups, which is how a U13+U18 HL block works.</p>
            <p>Everything else — prime-time fairness, avoiding back-to-back days, home rink, not stranding unusable gaps — is a preference the allocator balances rather than a rule it enforces. Double-bookings are the one thing it will never produce, and the one thing you can't save by hand.</p>
          </div>
        </Modal>
      )}

function UsageReport({ assignments, teams, rinks }) {
  const rows = useMemo(() => teams.map(t => {
    const mine = assignments.filter(a => (a.teamIds || []).includes(t.id));
    return {
      team: t,
      sessions: mine.length,
      minutes: mine.reduce((n, a) => n + toMin(a.end) - toMin(a.start), 0),
      prime: mine.filter(a => slotQuality(a.day, toMin(a.start)) === "prime").length,
      rough: mine.filter(a => slotQuality(a.day, toMin(a.start)) === "rough").length,
      shared: mine.filter(a => (a.teamIds || []).length > 1).length,
    };
  }), [assignments, teams]);
  const maxMin = Math.max(1, ...rows.map(r => r.minutes));
  const totalMin = rows.reduce((n, r) => n + r.minutes, 0);
  const rinkRows = rinks.map(r => ({
    rink: r,
    minutes: assignments.filter(a => a.rinkId === r.id).reduce((n, a) => n + toMin(a.end) - toMin(a.start), 0),
  }));

  return (
    <SectionCard title="Weekly usage" subtitle="Hours per team, and how the prime ice was shared out." pad={0}>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 620 }}>
          <thead>
            <tr>
              <th style={{ ...thStyle, textAlign: "left" }}>Team</th>
              <th style={{ ...thStyle }}>Ice times</th>
              <th style={{ ...thStyle }}>Hours/wk</th>
              <th style={{ ...thStyle }}>Prime</th>
              <th style={{ ...thStyle }}>Off-peak</th>
              <th style={{ ...thStyle }}>Shared</th>
              <th style={{ ...thStyle, width: 130 }}>Share</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.team.id}>
                <td style={{ ...tdStyle, textAlign: "left" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                    <LevelSwatch level={r.team.level} />
                    <span style={{ fontSize: 13, fontWeight: 500 }}>{teamName(r.team)}</span>
                  </div>
                </td>
                <td style={{ ...tdStyle, textAlign: "center", fontSize: 12 }}>{r.sessions || "—"}</td>
                <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, fontWeight: 600 }}>{r.minutes ? (r.minutes / 60).toFixed(1) : "—"}</td>
                <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, color: r.prime ? C.greenText : C.textLight }}>{r.prime || "—"}</td>
                <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, color: r.rough ? C.orangeText : C.textLight }}>{r.rough || "—"}</td>
                <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, color: r.shared ? C.blueText : C.textLight }}>{r.shared || "—"}</td>
                <td style={{ ...tdStyle }}>
                  <div style={{ height: 7, background: C.borderLight, borderRadius: 4, overflow: "hidden" }}>
                    <div style={{ height: 7, width: `${Math.round(r.minutes / maxMin * 100)}%`, background: levelColor(r.team.level).border }} />
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{ padding: "11px 16px", borderTop: `1px solid ${C.borderLight}`, display: "flex", gap: 16, flexWrap: "wrap", fontSize: 12, color: C.textMuted }}>
        <span><strong style={{ color: C.text }}>{(totalMin / 60).toFixed(1)}h</strong> a week</span>
        {rinkRows.filter(r => r.minutes).map(r => (
          <span key={r.rink.id}>{r.rink.short}: <strong style={{ color: C.text }}>{(r.minutes / 60).toFixed(1)}h</strong></span>
        ))}
      </div>
    </SectionCard>
  );
}

function BackupModal({ snapshot, onRestore, onClose }) {
  const fileRef = useRef(null);
  const [pending, setPending] = useState(null);
  const [err, setErr] = useState("");
  const onFile = e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || typeof parsed !== "object") throw new Error("bad");
        setPending(parsed); setErr("");
      } catch { setErr("That file isn't a valid backup."); }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  return (
    <Modal title="Data backup" width={460} onClose={onClose}
      footer={<><div style={{ flex: 1 }} /><button onClick={onClose} style={btn()}>Close</button></>}>
      <div style={{ fontSize: 13, lineHeight: 1.55, marginBottom: 14 }}>
        A snapshot of everything: rinks, teams, the weekly ice windows, the schedule, and the rules.
      </div>
      <div style={{ borderTop: `1px solid ${C.borderLight}`, paddingTop: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Download</div>
        <button onClick={() => downloadBlob("ice-data.json", JSON.stringify(snapshot, null, 2), "application/json")} style={btn()}>Download ice-data.json</button>
      </div>
      <div style={{ borderTop: `1px solid ${C.borderLight}`, paddingTop: 14, marginTop: 14 }}>
        <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>Restore</div>
        <div style={{ fontSize: 11, color: C.textMuted, marginBottom: 8, lineHeight: 1.5 }}>Overwrites everything currently loaded.</div>
        <input ref={fileRef} type="file" accept="application/json,.json" onChange={onFile} style={{ display: "none" }} />
        <button onClick={() => fileRef.current?.click()} style={btn()}>{"Choose file…"}</button>
        {pending && (
          <div style={{ marginTop: 12, background: C.orangeLight, border: `1px solid ${C.orange}`, borderRadius: 8, padding: "10px 12px" }}>
            <div style={{ fontSize: 12, color: C.orangeText, marginBottom: 8, lineHeight: 1.5 }}>
              Ready to restore {(pending.teams || []).length} teams, {(pending.slots || []).length} rink windows
              and {(pending.assignments || []).length} ice times.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setPending(null)} style={smallBtn()}>Cancel</button>
              <button onClick={() => { onRestore(pending); setPending(null); }} style={{ ...smallBtn(), background: C.accent, borderColor: C.accent, color: C.onAccent, fontWeight: 600 }}>Restore</button>
            </div>
          </div>
        )}
        {err && <div style={{ marginTop: 10, fontSize: 12, color: C.redText }}>{err}</div>}
      </div>
    </Modal>
  );
}

function App() {
  const [hydrated, setHydrated] = useState(false);
  const [cloudState, setCloudState] = useState({ mode: "checking", message: "" });
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("ice_theme") || "light"; } catch { return "light"; }
  });
  const [tab, setTab] = useState("schedule");

  const [rinks, setRinksRaw] = useState(DEFAULT_RINKS);
  const [teams, setTeamsRaw] = useState(DEFAULT_TEAMS);
  const [slots, setSlotsRaw] = useState(DEFAULT_SLOTS);
  const [assignments, setAssignmentsRaw] = useState([]);
  const [rules, setRulesRaw] = useState(DEFAULT_RULES);
  const [meta, setMetaRaw] = useState({ published: false, seedBanner: true, version: DATA_VERSION });

  const [lastResult, setLastResult] = useState(null);
  const [backupOpen, setBackupOpen] = useState(false);
  const [gate, setGate] = useState(null);
  const readyRef = useRef(false);

  const persist = (key, setter) => next => setter(prev => {
    const value = typeof next === "function" ? next(prev) : next;
    if (readyRef.current) save(key, value);
    return value;
  });
  const setRinks       = useCallback(persist("ice_rinks", setRinksRaw), []);
  const setTeams       = useCallback(persist("ice_teams", setTeamsRaw), []);
  const setSlots       = useCallback(persist("ice_slots", setSlotsRaw), []);
  const setAssignments = useCallback(persist("ice_assignments", setAssignmentsRaw), []);
  const setRules       = useCallback(persist("ice_rules", setRulesRaw), []);
  const setMeta        = useCallback(persist("ice_meta", setMetaRaw), []);

  useEffect(() => { applyTheme(theme); }, []);

  useEffect(() => {
    let alive = true;
    onCloudResult = r => {
      if (!alive) return;
      setCloudState(r.ok ? { mode: "cloud", message: "" } : { mode: "error", message: r.message });
    };
    hydrateFromCloud().then(res => {
      if (!alive) return;
      setCloudState(res.ok ? { mode: "cloud", message: "" } : { mode: "local", message: res.reason });

      const storedMeta = load("ice_meta", null);
      const fresh = !storedMeta || storedMeta.version !== DATA_VERSION;

      setRinksRaw(fresh ? DEFAULT_RINKS : load("ice_rinks", DEFAULT_RINKS));
      setTeamsRaw(fresh ? DEFAULT_TEAMS : load("ice_teams", DEFAULT_TEAMS));
      setSlotsRaw(fresh ? DEFAULT_SLOTS : load("ice_slots", DEFAULT_SLOTS));
      setRulesRaw({ ...DEFAULT_RULES, ...(fresh ? {} : load("ice_rules", {})) });

      const seeded = buildSeedAssignments();
      setAssignmentsRaw(fresh ? seeded : load("ice_assignments", seeded));
      setMetaRaw(fresh ? { published: false, seedBanner: true, version: DATA_VERSION } : storedMeta);

      readyRef.current = true;
      if (fresh) {
        // First run on this device (or a data-shape bump): write the
        // transcribed week so everyone starts from the same place.
        save("ice_rinks", DEFAULT_RINKS);
        save("ice_teams", DEFAULT_TEAMS);
        save("ice_slots", DEFAULT_SLOTS);
        save("ice_rules", DEFAULT_RULES);
        save("ice_assignments", seeded);
        save("ice_meta", { published: false, seedBanner: true, version: DATA_VERSION });
      }
      setHydrated(true);
    });
    return () => { alive = false; onCloudResult = () => {}; };
  }, []);

  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    setTheme(next);
    applyTheme(next);
    try { localStorage.setItem("ice_theme", next); } catch {}
    document.body.style.background = next === "dark" ? C_DARK.bg : C_LIGHT.bg;
  };
  useEffect(() => { document.body.style.background = C.bg; }, [theme, hydrated]);

  const isPublished = !!meta.published;

  // Fill the open ice. Additive by default — it never moves what's already
  // placed unless "start the week over" is ticked.
  const handleFill = ({ rebuild, requests }) => {
    const locked = rebuild ? [] : assignments.map(a => ({ ...a }));
    const usable = slots.filter(s => !s.blocked);
    const sol = solveSchedule({
      teams, slots: usable, rules, requests, locked,
      runs: 60, seed: Math.floor(Math.random() * 100000),
    });
    setAssignments(sol.assignments);
    const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
    setLastResult({
      placed: sol.assignments.length,
      runs: sol.runs,
      unplaced: sol.unplaced.map(u => ({ ...u, teamName: teamName(teamMap[u.teamId]) })),
    });
    setTab("schedule");
  };

  const togglePublish = () => setGate({
    action: isPublished ? "Unpublish the schedule" : "Publish the schedule to coaches",
    run: () => { setMeta(m => ({ ...m, published: !isPublished })); setGate(null); },
  });

  const snapshot = { version: DATA_VERSION, rinks, teams, slots, assignments, rules, meta };
  const restore = data => setGate({
    action: "Restore a backup over the current data",
    run: () => {
      if (data.rinks) setRinks(data.rinks);
      if (data.teams) setTeams(data.teams);
      if (data.slots) setSlots(data.slots);
      if (data.assignments) setAssignments(data.assignments);
      if (data.rules) setRules({ ...DEFAULT_RULES, ...data.rules });
      if (data.meta) setMeta({ ...data.meta, version: DATA_VERSION });
      setGate(null);
      setBackupOpen(false);
    },
  });

  const tabs = [
    { id: "schedule", label: "Schedule",      shortLabel: "Grid" },
    { id: "ice",      label: "Ice",           shortLabel: "Ice" },
    { id: "fill",     label: "Fill gaps",     shortLabel: "Fill" },
    { id: "teams",    label: "Teams & Rules", shortLabel: "Teams" },
  ];

  if (!hydrated) {
    return (
      <div style={{ background: C.bg, minHeight: "100vh", fontFamily: FONT, color: C.textMuted, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ fontSize: 14 }}>Loading schedule…</div>
      </div>
    );
  }

  const sync = cloudState.mode === "error" ? { c: C.redText, dot: C.red, text: "Sync error" }
             : cloudState.mode === "cloud" ? { c: C.greenText, dot: C.green, text: "Synced" }
             : cloudState.mode === "local" ? { c: C.textMuted, dot: C.border, text: "Local only" }
             : { c: C.textMuted, dot: C.border, text: "Checking…" };

  return (
    <div style={{ background: C.bg, minHeight: "100vh", fontFamily: FONT, color: C.text }}>
      <div style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "14px 18px", display: "flex", alignItems: "center", boxShadow: "0 1px 3px rgba(0,0,0,0.05)" }}>
        <span className="app-title" style={{ fontFamily: DISPLAY, fontSize: 21, fontWeight: 700, color: C.accent, whiteSpace: "nowrap" }}>Wild Ice Scheduler</span>
        <span style={{ fontSize: 12, color: C.textMuted, fontWeight: 500, marginLeft: 10 }}>{SEASON_LABEL}</span>
        <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <span title={cloudState.mode === "local" ? `Cloud sync is off (${cloudState.message}) — this device only.` : cloudState.message || "Shared schedule"}
                style={{ fontSize: 11, fontWeight: 600, color: sync.c, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", display: "inline-block", background: sync.dot }} />
            <span>{sync.text}</span>
          </span>
          <button onClick={toggleTheme} title={theme === "dark" ? "Light mode" : "Dark mode"} style={{
            fontSize: 14, color: C.textMuted, background: "transparent", border: `1px solid ${C.border}`,
            cursor: "pointer", padding: "4px 8px", borderRadius: 4, lineHeight: 1, fontFamily: FONT,
          }}>{theme === "dark" ? "☀" : "☾"}</button>
          <button onClick={() => setBackupOpen(true)} title="Data backup" style={{
            fontSize: 14, color: C.textMuted, background: "transparent", border: `1px solid ${C.border}`,
            cursor: "pointer", padding: "4px 8px", borderRadius: 4, lineHeight: 1, fontFamily: FONT,
          }}>{"⚙"}</button>
        </div>
      </div>

      <div style={{ display: "flex", background: C.surface, borderBottom: `1px solid ${C.border}`, overflowX: "auto" }}>
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            flex: 1, padding: "11px 0", background: "transparent",
            color: tab === t.id ? C.accent : C.textMuted, border: "none",
            borderBottom: tab === t.id ? `2px solid ${C.accent}` : "2px solid transparent",
            fontFamily: FONT, fontSize: 13, fontWeight: tab === t.id ? 600 : 500,
            cursor: "pointer", whiteSpace: "nowrap", minWidth: 70,
          }}>
            <span className="tab-desktop">{t.label}</span>
            <span className="tab-mobile">{t.shortLabel}</span>
          </button>
        ))}
      </div>

      <div style={{ maxWidth: 1500, margin: "0 auto", padding: "18px 14px" }}>
        {cloudState.mode === "error" && (
          <div style={{ background: C.redLight, border: `1px solid ${C.red}`, borderRadius: 8, padding: "11px 14px", marginBottom: 14, fontSize: 13, color: C.redText }}>
            <strong>Couldn't save to the shared schedule</strong> — changes are on this device only until this clears. ({cloudState.message})
          </div>
        )}

        {tab === "schedule" && (
          <ScheduleTab
            assignments={assignments} setAssignments={setAssignments}
            teams={teams} rinks={rinks} slots={slots} rules={rules}
            isPublished={isPublished} onTogglePublish={togglePublish}
            seedBannerOpen={!!meta.seedBanner}
            onDismissSeedBanner={() => setMeta(m => ({ ...m, seedBanner: false }))} />
        )}
        {tab === "ice" && <IceTab slots={slots} setSlots={setSlots} assignments={assignments} rinks={rinks} />}
        {tab === "fill" && (
          <FillTab teams={teams} rinks={rinks} slots={slots} assignments={assignments} rules={rules}
            onFill={handleFill} lastResult={lastResult} />
        )}
        {tab === "teams" && (
          <TeamsTab teams={teams} setTeams={setTeams} rinks={rinks} setRinks={setRinks}
            rules={rules} setRules={setRules} assignments={assignments} />
        )}

        <div style={{ textAlign: "center", fontSize: 11, color: C.textLight, padding: "22px 0 8px", lineHeight: 1.6 }}>
          {cloudState.mode === "local"
            ? "Running on this device only — see HANDOFF.md to turn on shared sync."
            : "Shared schedule · everyone with the link sees the same grid."}
        </div>
      </div>

      {backupOpen && <BackupModal snapshot={snapshot} onRestore={restore} onClose={() => setBackupOpen(false)} />}
      <EditGate open={!!gate} action={gate?.action} onConfirm={() => gate?.run()} onCancel={() => setGate(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
