const { useState, useEffect, useMemo, useCallback, useRef } = React;

function useIsMobile(breakpoint = 768) {
  const [isMobile, setIsMobile] = useState(() =>
    typeof window !== "undefined" && window.innerWidth <= breakpoint
  );
  useEffect(() => {
    const onResize = () => setIsMobile(window.innerWidth <= breakpoint);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, [breakpoint]);
  return isMobile;
}

// ══════════════════════════════════════════════════
// EDIT PASSPHRASE
// The access model is "the scheduler edits, coaches read". No login:
// anyone with the link sees the schedule, and the actions that change it
// for everyone ask for this shared passphrase plus a confirmation.
// Client-side only — a speed bump against accidents, not security.

// default, and it works. Fill them in with your own Supabase project to
// make the schedule shared: everyone with the link reads the same data,
// no login. The SQL to set that up is in HANDOFF.md.
// ══════════════════════════════════════════════════
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

const supabase = (() => {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return null;
  try { return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
  catch { return null; }
})();

function applyTheme(name) {
  const src = name === "dark" ? C_DARK : C_LIGHT;
  for (const k of Object.keys(src)) C[k] = src[k];
  const lv = name === "dark" ? LEVEL_COLORS_DARK : LEVEL_COLORS_LIGHT;

}

// ══════════════════════════════════════════════════
// TIME
// Everything internal is minutes since midnight. Strings ("HH:MM") are
// storage only; fmtTime is display only. Never mix them.
//
// STEP is 15, not 30, on purpose: this association's ice starts at 6:15,
// 5:15, 3:15, 8:30. A 30-minute grid silently rounds those to the wrong
// slot, which is exactly the kind of quiet corruption a scheduler can't
// afford.
// ══════════════════════════════════════════════════
const STEP = 15;
const MIN_USEFUL_BLOCK = 50;   // a free gap shorter than this is wasted ice

function toMin(hhmm) {
  if (typeof hhmm === "number") return hhmm;
  if (!hhmm) return 0;
  const [h, m] = String(hhmm).split(":").map(Number);
  return (h || 0) * 60 + (m || 0);
}
function toHHMM(min) {
  const m = Math.max(0, Math.round(min));
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}
function fmtTime(min) {
  const m = toMin(min);
  let h = Math.floor(m / 60), mm = m % 60;
  const suffix = h >= 12 ? "p" : "a";
  h = h % 12 === 0 ? 12 : h % 12;
  return mm === 0 ? `${h}${suffix}` : `${h}:${String(mm).padStart(2, "0")}${suffix}`;
}
function fmtRange(s, e) { return `${fmtTime(s)}–${fmtTime(e)}`; }
function fmtDur(min) {
  const h = Math.floor(min / 60), m = min % 60;
  if (h && m) return `${h}h ${m}m`;
  if (h) return `${h}h`;
  return `${m}m`;
}

// wants. Both are tracked per team so the allocator can spread the pain.
const PRIME_WEEKDAY = { start: toMin("17:30"), end: toMin("20:00") };
const PRIME_WEEKEND = { start: toMin("09:00"), end: toMin("15:00") };
const ROUGH_WEEKEND_BEFORE = toMin("08:00");
const ROUGH_WEEKDAY_AFTER  = toMin("20:30");

function slotQuality(day, startMin) {
  const weekend = isWeekendDay(day);
  const prime = weekend ? PRIME_WEEKEND : PRIME_WEEKDAY;
  if (weekend && startMin < ROUGH_WEEKEND_BEFORE) return "rough";
  if (!weekend && startMin >= ROUGH_WEEKDAY_AFTER) return "rough";
  if (startMin >= prime.start && startMin < prime.end) return "prime";
  return "standard";
}

// ══════════════════════════════════════════════════
// PERSISTENCE
// localStorage is always the working store. If a Supabase project is
// configured we mirror every write there and hydrate from it on load,
// which is what makes the schedule shared. If it isn't, `cloudReady`
// stays false and the app runs local-only — no error, just a "Local only"
// badge in the header.
// ══════════════════════════════════════════════════
const KEY_TO_COLUMN = {
  "ice_rinks":       "rinks",
  "ice_teams":       "teams",
  "ice_slots":       "slots",
  "ice_assignments": "assignments",
  "ice_rules":       "age_rules",
  "ice_meta":        "meta",
};
const cloudCache = {};
let cloudReady = false;

async function hydrateFromCloud() {
  if (!supabase) return { ok: false, reason: "cloud sync not configured" };
  try {
    const { data, error } = await supabase.from("ice_data").select("*").eq("id", 1).maybeSingle();
    if (error) return { ok: false, reason: error.message };
    if (!data) return { ok: false, reason: "no row" };
    for (const [key, column] of Object.entries(KEY_TO_COLUMN)) {
      if (data[column] != null) cloudCache[key] = data[column];
    }
    cloudReady = true;
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: e?.message || String(e) };
  }
}

async function pushToCloud(key, value) {
  const column = KEY_TO_COLUMN[key];
  if (!column || !cloudReady) return { ok: true, skipped: true };
  try {
    const { error } = await supabase.from("ice_data").update({ [column]: value }).eq("id", 1);
    if (error) return { ok: false, reason: error.message };
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: e?.message || String(e) };
  }
}

let onCloudResult = () => {};

function load(k, fb) {
  if (cloudReady && cloudCache[k] !== undefined) return cloudCache[k];
  try {
    const raw = localStorage.getItem(k);
    return raw ? JSON.parse(raw) : fb;
  } catch { return fb; }
}

function save(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
  if (cloudReady) {
    cloudCache[k] = v;
    pushToCloud(k, v).then(r => {
      if (!r.ok) onCloudResult({ ok: false, message: r.reason });
      else if (!r.skipped) onCloudResult({ ok: true });
    });
  }
}

// ══════════════════════════════════════════════════
// RULE ACCESS
// ══════════════════════════════════════════════════
function ruleFor(rules, ageGroup) {
  return rules[ageGroup] || DEFAULT_RULES[ageGroup] || DEFAULT_RULES.u11;
}
function windowFor(rules, ageGroup, day) {
  const r = ruleFor(rules, ageGroup);
  const w = r[dayTypeOf(day)] || r.weekday;
  return {
    earliest: toMin(w.earliest),
    latest: toMin(w.latest),
    duration: r.durationMin,
    maxPerDay: r.maxPerDay ?? 1,
    maxPerWeek: r.maxPerWeek ?? 4,
  };
}
function windowWidth(rules, ageGroup, day) {
  const w = windowFor(rules, ageGroup, day);
  return Math.max(0, w.latest - w.earliest);
}

// Two teams may share a sheet if their age groups are both flagged for it
// (the youngest bands run cross-ice) OR they're the same level and that
// level shares — which is how `U13+U18 HL` works on the source sheet.
function canShare(rules, teamA, teamB) {
  if (!teamA || !teamB) return false;
  const byAge = ruleFor(rules, teamA.ageGroup).allowShared && ruleFor(rules, teamB.ageGroup).allowShared;
  const byLevel = teamA.level === teamB.level && SHARE_LEVELS.has(teamA.level);
  return byAge || byLevel;
}
// Could this team share with *someone*? Used to decide whether to bother
// enumerating join placements at all.
function mayShare(rules, team) {
  return ruleFor(rules, team.ageGroup).allowShared || SHARE_LEVELS.has(team.level);
}

// ══════════════════════════════════════════════════
// SCHEDULING ENGINE
//
// The problem: a set of *slots* (blocks of ice bought at a rink on a
// weekday) and a set of *requests* (team X needs N ice times this week). A
// request can go anywhere inside a slot as long as the whole ice time
// fits, starts inside the team's age-band window, and doesn't collide.
//
// Greedy with restarts: order the requests hardest-first, place each at
// its lowest-cost feasible spot with a little jitter so repeated runs
// explore different orderings, score the finished week, keep the best of
// N runs.
// ══════════════════════════════════════════════════

function assignmentsInSlot(assignments, slotId) {
  return assignments
    .filter(a => a.slotId === slotId)
    .sort((a, b) => toMin(a.start) - toMin(b.start));
}

// Free intervals remaining in a slot, as [{start,end}] in minutes.
function freeSegments(slot, assignments) {
  const busy = assignmentsInSlot(assignments, slot.id).map(a => ({ s: toMin(a.start), e: toMin(a.end) }));
  const out = [];
  let cursor = toMin(slot.start);
  const slotEnd = toMin(slot.end);
  for (const b of busy) {
    if (b.s > cursor) out.push({ start: cursor, end: Math.min(b.s, slotEnd) });
    cursor = Math.max(cursor, b.e);
  }
  if (cursor < slotEnd) out.push({ start: cursor, end: slotEnd });
  return out.filter(seg => seg.end > seg.start);
}

function slotUtilization(slot, assignments) {
  const total = toMin(slot.end) - toMin(slot.start);
  const free = freeSegments(slot, assignments);
  const freeMin = free.reduce((n, s) => n + (s.end - s.start), 0);
  const stranded = free.reduce((n, s) => n + (s.end - s.start < MIN_USEFUL_BLOCK ? s.end - s.start : 0), 0);
  return { total, booked: total - freeMin, free: freeMin, stranded, segments: free };
}

function teamBusy(assignments, teamId, day, start, end, ignoreId) {
  return assignments.some(a =>
    a.id !== ignoreId &&
    a.day === day &&
    (a.teamIds || []).includes(teamId) &&
    overlaps(toMin(a.start), toMin(a.end), start, end)
  );
}
function teamSessionsOnDay(assignments, teamId, day) {
  return assignments.filter(a => a.day === day && (a.teamIds || []).includes(teamId)).length;
}
function teamSessions(assignments, teamId) {
  return assignments.filter(a => (a.teamIds || []).includes(teamId));
}

// Every legal placement for one team. `mode` is "new" for a fresh ice time
// carved out of free space, or "join" for sharing an existing one.
function candidatePlacements({ team, slots, assignments, rules, teamMap }) {
  const out = [];
  const blackoutDows = team.blackoutDows || [];

  for (const slot of slots) {
    if (slot.blocked) continue;                       // tournament / public skate
    if (blackoutDows.includes(slot.day)) continue;

    const w = windowFor(rules, team.ageGroup, slot.day);
    const slotStart = toMin(slot.start), slotEnd = toMin(slot.end);

    // ── Sharing: join an existing ice time of exactly the same length.
    if (mayShare(rules, team)) {
      for (const a of assignmentsInSlot(assignments, slot.id)) {
        if ((a.teamIds || []).length >= 2) continue;
        if (toMin(a.end) - toMin(a.start) !== w.duration) continue;
        const other = teamMap[a.teamIds?.[0]];
        if (!other || !canShare(rules, team, other)) continue;
        const start = toMin(a.start);
        if (start < Math.max(slotStart, w.earliest) || start > w.latest) continue;
        if (teamBusy(assignments, team.id, slot.day, start, start + w.duration)) continue;
        out.push({ mode: "join", joinId: a.id, slotId: slot.id, rinkId: slot.rinkId, day: slot.day, start, end: start + w.duration });
      }
    }

    // ── Fresh placements inside each free segment.
    for (const seg of freeSegments(slot, assignments)) {
      const lo = Math.max(seg.start, w.earliest);
      const hi = Math.min(seg.end - w.duration, w.latest);
      if (hi < lo) continue;
      // Align to the STEP grid, but always include the two placements that
      // waste nothing: flush to the start of the segment and flush to its
      // end. Those are what keep ice from being stranded.
      const starts = new Set([lo]);
      for (let t = Math.ceil(lo / STEP) * STEP; t <= hi; t += STEP) starts.add(t);
      const flushEnd = seg.end - w.duration;
      if (flushEnd >= lo && flushEnd <= hi) starts.add(flushEnd);
      for (const start of starts) {
        if (start < lo || start > hi) continue;
        if (teamBusy(assignments, team.id, slot.day, start, start + w.duration)) continue;
        out.push({ mode: "new", slotId: slot.id, rinkId: slot.rinkId, day: slot.day, start, end: start + w.duration, segStart: seg.start, segEnd: seg.end });
      }
    }
  }
  return out;
}

// Cost of a placement, lower is better.
function placementCost(p, { team, state, rules }) {
  let cost = 0;
  const quality = slotQuality(p.day, p.start);

  if (p.mode === "join") {
    // Sharing consumes no new ice — reward it.
    cost -= 4;
  } else {
    // Stranding: what's left of this free segment once we take our bite.
    const before = p.start - p.segStart;
    const after = p.segEnd - p.end;
    for (const gap of [before, after]) {
      if (gap === 0) continue;
      if (gap < MIN_USEFUL_BLOCK) cost += 0.06 * gap;   // dead ice, priced per minute
      else cost += 0.004 * gap;                         // usable, mild packing bias
    }
  }

  // Fairness against the running association average.
  const myPrime = state.primeCount[team.id] || 0;
  const myRough = state.roughCount[team.id] || 0;
  if (quality === "prime") cost += 2.5 * Math.max(0, myPrime - (state.primeAvg || 0));
  if (quality === "rough") cost += 2.5 * Math.max(0, myRough - (state.roughAvg || 0)) + 1.2;

  // Mild bias toward the front of the band's window.
  const w = windowFor(rules, team.ageGroup, p.day);
  const span = Math.max(1, w.latest - w.earliest);
  cost += 0.8 * ((p.start - w.earliest) / span);

  // Spacing.
  const sameDay = teamSessionsOnDay(state.assignments, team.id, p.day);
  if (sameDay > 0) cost += 6;
  if (sameDay >= w.maxPerDay) cost += 12;

  // Home rink, a tie-breaker and nothing more.
  if (team.homeRinkId && p.rinkId !== team.homeRinkId) cost += 0.9;

  return cost;
}

function solveOnce({ teams, slots, rules, requests, locked, rand }) {
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const assignments = locked.map(a => ({ ...a, teamIds: [...(a.teamIds || [])] }));
  const primeCount = {}, roughCount = {};
  for (const t of teams) { primeCount[t.id] = 0; roughCount[t.id] = 0; }
  for (const a of assignments) {
    const q = slotQuality(a.day, toMin(a.start));
    for (const tid of a.teamIds || []) {
      if (q === "prime") primeCount[tid] = (primeCount[tid] || 0) + 1;
      if (q === "rough") roughCount[tid] = (roughCount[tid] || 0) + 1;
    }
  }

  const unplaced = [];
  const state = { assignments, primeCount, roughCount, primeAvg: 0, roughAvg: 0 };

  // Hardest-first: the team whose age band has the narrowest start window
  // has the fewest places to go, so it picks before anyone else.
  const tightness = {};
  for (const t of teams) {
    tightness[t.id] = mean(DAYS.map(d => windowWidth(rules, t.ageGroup, d)));
  }

  let remaining = requests.map((r, i) => ({ ...r, _i: i }));
  while (remaining.length) {
    remaining.sort((a, b) => {
      const ta = tightness[a.teamId] ?? 9999, tb = tightness[b.teamId] ?? 9999;
      return ta !== tb ? ta - tb : a._i - b._i;
    });
    const headTight = tightness[remaining[0].teamId] ?? 9999;
    const tied = remaining.filter(r => (tightness[r.teamId] ?? 9999) === headTight);
    const req = tied[Math.floor(rand() * tied.length)];
    remaining = remaining.filter(r => r !== req);

    const team = teamMap[req.teamId];
    if (!team) continue;

    state.primeAvg = mean(Object.values(primeCount));
    state.roughAvg = mean(Object.values(roughCount));

    const cands = candidatePlacements({ team, slots, assignments, rules, teamMap });
    if (!cands.length) {
      unplaced.push({ ...req, reason: "no open ice inside this team's start window" });
      continue;
    }

    let best = null, bestCost = Infinity;
    for (const p of cands) {
      const c = placementCost(p, { team, state, rules }) + rand() * 0.9;
      if (c < bestCost) { bestCost = c; best = p; }
    }

    if (best.mode === "join") {
      const target = assignments.find(a => a.id === best.joinId);
      target.teamIds = [...target.teamIds, team.id];
      target.shared = true;
    } else {
      assignments.push({
        id: uid("ice"),
        slotId: best.slotId, rinkId: best.rinkId, day: best.day,
        start: toHHMM(best.start), end: toHHMM(best.end),
        teamIds: [team.id],
        kind: req.kind || "practice",
        shared: false,
      });
    }
    const q = slotQuality(best.day, best.start);
    if (q === "prime") primeCount[team.id] = (primeCount[team.id] || 0) + 1;
    if (q === "rough") roughCount[team.id] = (roughCount[team.id] || 0) + 1;
  }

  return { assignments, unplaced, primeCount, roughCount };
}

function scoreSolution(sol, { slots, teams }) {
  let score = sol.unplaced.length * 1000;
  for (const slot of slots) score += slotUtilization(slot, sol.assignments).stranded * 0.4;

  const primes = teams.map(t => sol.primeCount[t.id] || 0);
  const roughs = teams.map(t => sol.roughCount[t.id] || 0);
  const pm = mean(primes), rm = mean(roughs);
  score += mean(primes.map(v => (v - pm) ** 2)) * 8;
  score += mean(roughs.map(v => (v - rm) ** 2)) * 8;

  for (const t of teams) {
    const byDay = {};
    for (const a of teamSessions(sol.assignments, t.id)) byDay[a.day] = (byDay[a.day] || 0) + 1;
    for (const n of Object.values(byDay)) if (n > 1) score += (n - 1) * 15;
  }
  return score;
}

function makeRand(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

// Best of `runs` greedy attempts. A fresh `seed` each click means "try
// again" explores a genuinely different arrangement.
function solveSchedule({ teams, slots, rules, requests, locked = [], runs = 60, seed = 0 }) {
  let best = null, bestScore = Infinity;
  for (let i = 0; i < runs; i++) {
    const sol = solveOnce({ teams, slots, rules, requests, locked, rand: makeRand((seed + i) * 7919 + 13) });
    const score = scoreSolution(sol, { slots, teams });
    if (score < bestScore) { bestScore = score; best = sol; }
    if (bestScore === 0) break;
  }
  return { ...best, score: bestScore, runs };
}

// ══════════════════════════════════════════════════
// CONFLICTS
// The whole reason this app exists. A double-booking must be impossible
// to save, not something caught by eye afterwards — so these two helpers
// are called from every edit path, and the Save button is disabled until
// they come back clean.
// ══════════════════════════════════════════════════

// Is anything else already on this sheet of ice at this time?
function findRinkConflict(assignments, { rinkId, day, start, end }, ignoreId) {
  return assignments.find(a =>
    a.id !== ignoreId &&
    a.rinkId === rinkId &&
    a.day === day &&
    overlaps(toMin(a.start), toMin(a.end), start, end)
  ) || null;
}

// Is this team already on the ice somewhere else at this time?
function findTeamConflict(assignments, teamIds, { day, start, end }, ignoreId) {
  for (const tid of teamIds || []) {
    const hit = assignments.find(a =>
      a.id !== ignoreId &&
      a.day === day &&
      (a.teamIds || []).includes(tid) &&
      overlaps(toMin(a.start), toMin(a.end), start, end)
    );
    if (hit) return { assignment: hit, teamId: tid };
  }
  return null;
}

// Every overlap currently sitting in the data — for the banner. Catches
// anything that arrived by import or restore rather than through the UI.
function scanConflicts(assignments) {
  const out = [];
  const byRinkDay = {};
  for (const a of assignments) {
    const k = `${a.rinkId}|${a.day}`;
    (byRinkDay[k] = byRinkDay[k] || []).push(a);
  }
  for (const list of Object.values(byRinkDay)) {
    const sorted = [...list].sort((x, y) => toMin(x.start) - toMin(y.start));
    for (let i = 0; i < sorted.length; i++) {
      for (let j = i + 1; j < sorted.length; j++) {
        if (overlaps(toMin(sorted[i].start), toMin(sorted[i].end), toMin(sorted[j].start), toMin(sorted[j].end))) {
          out.push([sorted[i], sorted[j]]);
        }
      }
    }
  }
  return out;
}

function describeAssignment(a, teamMap) {
  const names = (a.teamIds || []).map(id => teamName(teamMap[id])).join(" + ");
  return `${names} (${fmtRange(toMin(a.start), toMin(a.end))})`;
}

// ══════════════════════════════════════════════════
// VALIDATION
// Overlaps are hard errors and are blocked at the point of edit. The rest
// is advisory: rule mismatches, coverage gaps, wasted ice.
// ══════════════════════════════════════════════════
function validateSchedule({ assignments, teams, slots, rinks, rules, requests }) {
  const issues = [];
  const add = (severity, message, extra = {}) => issues.push({ severity, message, ...extra });
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const slotMap = Object.fromEntries(slots.map(s => [s.id, s]));

  for (const [a, b] of scanConflicts(assignments)) {
    add("error", `${rinkMap[a.rinkId]?.short || "Rink"} ${DOW_LONG[a.day]} — ${describeAssignment(a, teamMap)} overlaps ${describeAssignment(b, teamMap)}`, { assignmentId: a.id, otherId: b.id });
  }

  for (const t of teams) {
    const mine = assignments.filter(a => (a.teamIds || []).includes(t.id));
    const byDay = {};
    for (const a of mine) (byDay[a.day] = byDay[a.day] || []).push(a);
    for (const [day, list] of Object.entries(byDay)) {
      const d = Number(day);
      const sorted = [...list].sort((x, y) => toMin(x.start) - toMin(y.start));
      for (let i = 1; i < sorted.length; i++) {
        if (overlaps(toMin(sorted[i-1].start), toMin(sorted[i-1].end), toMin(sorted[i].start), toMin(sorted[i].end))) {
          add("error", `${teamName(t)} is in two places at once on ${DOW_LONG[d]}`, { assignmentId: sorted[i].id, teamId: t.id });
        }
      }
      const w = windowFor(rules, t.ageGroup, d);
      if (sorted.length > w.maxPerDay) {
        add("warn", `${teamName(t)} has ${sorted.length} ice times on ${DOW_LONG[d]} (max ${w.maxPerDay})`, { teamId: t.id });
      }
      if ((t.blackoutDows || []).includes(d)) {
        add("warn", `${teamName(t)} is scheduled ${DOW_LONG[d]} but doesn't skate that day`, { teamId: t.id });
      }
    }
  }

  for (const a of assignments) {
    const start = toMin(a.start), end = toMin(a.end);
    for (const tid of a.teamIds || []) {
      const t = teamMap[tid];
      if (!t) continue;
      const w = windowFor(rules, t.ageGroup, a.day);
      const band = AGE_MAP[t.ageGroup]?.label;
      if (start < w.earliest) {
        add("warn", `${teamName(t)} starts ${fmtTime(start)} ${DOW_SHORT[a.day]} — before the ${band} ${dayTypeOf(a.day)} limit of ${fmtTime(w.earliest)}`, { assignmentId: a.id, teamId: tid });
      }
      if (start > w.latest) {
        add("warn", `${teamName(t)} starts ${fmtTime(start)} ${DOW_SHORT[a.day]} — after the ${band} ${dayTypeOf(a.day)} limit of ${fmtTime(w.latest)}`, { assignmentId: a.id, teamId: tid });
      }
      if (end - start !== w.duration) {
        add("info", `${teamName(t)} ${DOW_SHORT[a.day]} is ${fmtDur(end - start)} — ${band} ice times are normally ${fmtDur(w.duration)}`, { assignmentId: a.id, teamId: tid });
      }
    }
    if ((a.teamIds || []).length > 1) {
      const [x, y] = (a.teamIds || []).map(id => teamMap[id]);
      if (x && y && !canShare(rules, x, y)) {
        add("warn", `${teamName(x)} and ${teamName(y)} share ice ${DOW_SHORT[a.day]}, but the rules don't allow that pairing`, { assignmentId: a.id });
      }
    }
    const slot = slotMap[a.slotId];
    if (slot && (start < toMin(slot.start) || end > toMin(slot.end))) {
      add("error", `${DOW_SHORT[a.day]} ${fmtRange(start, end)} runs outside the ${rinkMap[a.rinkId]?.short || "rink"} window (${fmtRange(toMin(slot.start), toMin(slot.end))})`, { assignmentId: a.id });
    }
    if (!slot) add("warn", `An ice time on ${DOW_LONG[a.day]} isn't attached to a rink window`, { assignmentId: a.id });
  }

  if (requests && requests.length) {
    const need = {};
    for (const r of requests) need[r.teamId] = (need[r.teamId] || 0) + 1;
    for (const [tid, n] of Object.entries(need)) {
      const t = teamMap[tid];
      if (!t) continue;
      const got = assignments.filter(a => (a.teamIds || []).includes(tid)).length;
      if (got < n) add("warn", `${teamName(t)} has ${got} of ${n} requested ice times`, { teamId: tid });
    }
  }

  let stranded = 0, open = 0;
  for (const slot of slots) {
    if (slot.blocked) continue;
    const u = slotUtilization(slot, assignments);
    stranded += u.stranded;
    open += u.free - u.stranded;
  }
  if (stranded > 0) add("info", `${fmtDur(stranded)} of ice is stranded in gaps too short to use`);
  if (open >= MIN_USEFUL_BLOCK) add("info", `${fmtDur(open)} of ice is still open and bookable`);

  const order = { error: 0, warn: 1, info: 2 };
  issues.sort((a, b) => order[a.severity] - order[b.severity]);
  return issues;
}

function Modal({ title, subtitle, onClose, children, width = 520, footer }) {
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(10,20,35,0.45)", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: 16, zIndex: 100, overflowY: "auto" }}>
      <div onClick={e => e.stopPropagation()} style={{ background: C.surface, borderRadius: 12, border: `1px solid ${C.border}`, width: "100%", maxWidth: width, marginTop: 40, marginBottom: 40, boxShadow: "0 20px 60px rgba(10,20,35,0.3)" }}>
        <div style={{ padding: "14px 18px", borderBottom: `1px solid ${C.borderLight}`, display: "flex", alignItems: "flex-start" }}>
          <div>
            <div style={{ fontFamily: DISPLAY, fontSize: 17, fontWeight: 700, color: C.text }}>{title}</div>
            {subtitle && <div style={{ fontSize: 12, color: C.textMuted, marginTop: 2 }}>{subtitle}</div>}
          </div>
          <button onClick={onClose} style={{ marginLeft: "auto", background: "transparent", border: "none", color: C.textMuted, fontSize: 20, lineHeight: 1, cursor: "pointer", fontFamily: FONT }}>×</button>
        </div>
        <div style={{ padding: 18 }}>{children}</div>
        {footer && <div style={{ padding: "12px 18px", borderTop: `1px solid ${C.borderLight}`, display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>{footer}</div>}
      </div>
    </div>
  );
}

// A button with a panel hanging off it. Used for the share menu and the
// status dropdown, so the toolbar can carry a lot without the page
// growing a stack of banners. `children` is a function so an item can
// close the menu after acting.
function Menu({ trigger, width = 250, align = "right", children, panelStyle }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDoc = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = e => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDoc);
    window.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); window.removeEventListener("keydown", onKey); };
  }, [open]);
  const close = () => setOpen(false);
  return (
    <div ref={ref} style={{ position: "relative", display: "inline-flex" }}>
      {trigger(() => setOpen(o => !o), open)}
      {open && (
        <div style={{
          position: "absolute", top: "calc(100% + 6px)", [align]: 0, width, zIndex: 50,
          background: C.surface, border: `1px solid ${C.border}`, borderRadius: 9,
          boxShadow: "0 12px 32px rgba(10,20,35,0.22)", overflow: "hidden",
          ...panelStyle,
        }}>
          {typeof children === "function" ? children(close) : children}
        </div>
      )}
    </div>
  );
}

// The shared-passphrase speed bump.

// ══════════════════════════════════════════════════
// THE GRID
// The schedule the way a scheduler draws it: time down the side, one
// column per rink grouped under its day, coloured blocks sized by
// duration. This is the view that has to be recognisable at a glance.
//
// Rows are 15 minutes, not 30 — see the note on STEP. The visible time
// range is computed from the ice that actually exists, so a rink running
// to 11:15pm is shown rather than clipped.
// ══════════════════════════════════════════════════
const ROW_H = 13;              // px per 15-minute row
const GRID_COL_MIN = 116;

function gridBounds(slots) {
  if (!slots.length) return { start: 8 * 60, end: 22 * 60 };
  let lo = Infinity, hi = -Infinity;
  for (const s of slots) {
    lo = Math.min(lo, toMin(s.start));
    hi = Math.max(hi, toMin(s.end));
  }
  return { start: Math.floor(lo / 60) * 60, end: Math.ceil(hi / 60) * 60 };
}

// Blocks that overlap in the same column get side-by-side lanes rather
// than being drawn on top of each other. A conflict you can't see is
// worse than no conflict detection at all.
function assignLanes(list) {
  const sorted = [...list].sort((a, b) => toMin(a.start) - toMin(b.start));
  const laneEnds = [];
  const placed = sorted.map(a => {
    const s = toMin(a.start), e = toMin(a.end);
    let lane = laneEnds.findIndex(end => end <= s);
    if (lane === -1) { lane = laneEnds.length; laneEnds.push(e); }
    else laneEnds[lane] = e;
    return { a, lane };
  });
  // Lane count is per overlap-cluster, but column-wide is close enough and
  // far simpler; clusters are tiny in practice.
  const lanes = Math.max(1, laneEnds.length);
  return placed.map(p => ({ ...p, lanes }));
}

function ScheduleGrid({
  slots, assignments, rinks, teamMap, rules,
  conflictIds, swapPick, readOnly,
  onBlockClick, onEmptyClick,
}) {
  const bounds = useMemo(() => gridBounds(slots), [slots]);
  const rows = Math.max(1, (bounds.end - bounds.start) / STEP);
  const rowOf = m => Math.round((m - bounds.start) / STEP);

  // One column per (day, rink) that has ice, in Mon…Sun then rink order.
  const columns = useMemo(() => {
    const out = [];
    for (const day of DAYS) {
      for (const r of rinks) {
        const mine = slots.filter(s => s.day === day && s.rinkId === r.id);
        if (mine.length) out.push({ key: `${day}-${r.id}`, day, rink: r, slots: mine });
      }
    }
    return out;
  }, [slots, rinks]);

  const dayGroups = useMemo(() => {
    const out = [];
    for (const day of DAYS) {
      const n = columns.filter(c => c.day === day).length;
      if (n) out.push({ day, span: n });
    }
    return out;
  }, [columns]);

  if (!columns.length) {
    return (
      <SectionCard title="No ice yet">
        <div style={{ fontSize: 13, color: C.textMuted, lineHeight: 1.6 }}>
          No rink windows are set up. Add them on the <strong>Ice</strong> tab and they'll appear here.
        </div>
      </SectionCard>
    );
  }

  const byColumn = {};
  for (const c of columns) {
    byColumn[c.key] = assignLanes(assignments.filter(a => a.day === c.day && a.rinkId === c.rink.id));
  }

  return (
    <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, overflow: "hidden", marginBottom: 16 }}>
      <div style={{ overflow: "auto", maxHeight: "calc(100vh - 210px)" }}>
        <div style={{
          display: "grid",
          gridTemplateColumns: `62px repeat(${columns.length}, minmax(${GRID_COL_MIN}px, 1fr))`,
          gridTemplateRows: `26px 42px repeat(${rows}, ${ROW_H}px)`,
          width: "max-content", minWidth: "100%",
        }}>
          {/* corner */}
          <div style={{
            gridColumn: 1, gridRow: "1 / 3", position: "sticky", left: 0, top: 0, zIndex: 5,
            background: C.surfaceAlt, borderBottom: `1px solid ${C.border}`,
            display: "flex", alignItems: "flex-end", padding: "0 6px 5px",
            fontSize: 10, fontWeight: 700, color: C.textMuted,
          }}>Time</div>

          {/* day headers, spanning their rink columns */}
          {(() => {
            let cursor = 2;
            return dayGroups.map(g => {
              const el = (
                <div key={g.day} style={{
                  gridColumn: `${cursor} / ${cursor + g.span}`, gridRow: 1,
                  position: "sticky", top: 0, zIndex: 4,
                  background: C.accent, color: C.onAccent,
                  fontFamily: DISPLAY, fontWeight: 700, fontSize: 12.5,
                  display: "flex", alignItems: "center", justifyContent: "center",
                  borderLeft: `1px solid ${C.surface}`,
                }}>{DOW_LONG[g.day]}</div>
              );
              cursor += g.span;
              return el;
            });
          })()}

          {/* rink sub-headers */}
          {columns.map((c, i) => {
            const win = c.slots.map(s => fmtRange(toMin(s.start), toMin(s.end))).join(", ");
            const note = c.slots.map(s => s.note).filter(Boolean).join(" ");
            return (
              <div key={c.key} style={{
                gridColumn: i + 2, gridRow: 2, position: "sticky", top: 26, zIndex: 4,
                background: C.accentDark, color: C.onAccent,
                borderLeft: `1px solid ${C.accent}`, borderBottom: `1px solid ${C.border}`,
                padding: "3px 7px", display: "flex", flexDirection: "column", justifyContent: "center", overflow: "hidden",
              }}>
                <div style={{ fontWeight: 700, fontSize: 11.5, whiteSpace: "nowrap" }}>{c.rink.short}</div>
                <div style={{ fontSize: 9.5, opacity: 0.75, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  {win}{note ? ` ${note}` : ""}
                </div>
              </div>
            );
          })}

          {/* time gutter */}
          {Array.from({ length: rows }).map((_, r) => {
            const m = bounds.start + r * STEP;
            const isHour = m % 60 === 0;
            return (
              <div key={`t${r}`} style={{
                gridColumn: 1, gridRow: r + 3, position: "sticky", left: 0, zIndex: 3,
                background: C.surface,
                borderTop: isHour ? `1px solid ${C.gridLineHour}` : "none",
                fontSize: 9.5, color: C.textMuted, fontWeight: isHour ? 600 : 400,
                paddingLeft: 6, lineHeight: 1,
              }}>{isHour ? fmtTime(m) : ""}</div>
            );
          })}

          {/* background cells — open ice is clickable, closed hours hatched */}
          {columns.map((c, ci) =>
            Array.from({ length: rows }).map((_, r) => {
              const m = bounds.start + r * STEP;
              const slot = c.slots.find(s => m >= toMin(s.start) && m < toMin(s.end));
              const covered = (byColumn[c.key] || []).some(({ a }) => m >= toMin(a.start) && m < toMin(a.end));
              if (covered) return null;
              const isHour = m % 60 === 0;
              const open = !!slot && !slot.blocked;
              return (
                <div key={`${c.key}-${r}`}
                  onClick={() => open && !readOnly && onEmptyClick(slot, m)}
                  style={{
                    gridColumn: ci + 2, gridRow: r + 3,
                    borderTop: isHour ? `1px solid ${C.gridLineHour}` : `1px solid ${C.gridLine}`,
                    borderLeft: `1px solid ${C.gridLine}`,
                    background: slot
                      ? (slot.blocked
                          ? `repeating-linear-gradient(135deg, ${C.orangeLight}, ${C.orangeLight} 5px, ${C.closedAlt} 5px, ${C.closedAlt} 10px)`
                          : C.surface)
                      : `repeating-linear-gradient(135deg, ${C.closed}, ${C.closed} 5px, ${C.closedAlt} 5px, ${C.closedAlt} 10px)`,
                    cursor: open && !readOnly ? "pointer" : "default",
                  }}
                  onMouseEnter={e => { if (open && !readOnly) e.currentTarget.style.background = C.accentLight; }}
                  onMouseLeave={e => { if (open) e.currentTarget.style.background = C.surface; }}
                />
              );
            })
          )}

          {/* booking blocks */}
          {columns.map((c, ci) =>
            (byColumn[c.key] || []).map(({ a, lane, lanes }) => {
              const s = toMin(a.start), e = toMin(a.end);
              const teams = (a.teamIds || []).map(id => teamMap[id]).filter(Boolean);
              const col = levelColor(teams[0]?.level);
              const conflict = conflictIds.has(a.id);
              const selected = swapPick === a.id;
              const tall = (e - s) >= 45;
              return (
                <button key={a.id} className={selected ? "swap-selected" : ""}
                  onClick={() => onBlockClick(a)}
                  title={`${teams.map(teamName).join(" + ")} · ${fmtRange(s, e)}${conflict ? " · CONFLICT" : ""}`}
                  style={{
                    gridColumn: ci + 2,
                    gridRow: `${rowOf(s) + 3} / ${rowOf(e) + 3}`,
                    marginLeft: `${lane * (100 / lanes)}%`,
                    width: `${100 / lanes}%`,
                    borderRadius: 4,
                    borderWidth: conflict ? 2 : 1,
                    borderStyle: "solid",
                    borderColor: conflict ? C.red : (selected ? C.accent : col.border),
                    background: conflict
                      ? `repeating-linear-gradient(135deg, ${col.bg}, ${col.bg} 5px, ${C.redLight} 5px, ${C.redLight} 10px)`
                      : col.bg,
                    color: col.text,
                    fontFamily: FONT, textAlign: "left",
                    padding: tall ? "2px 5px" : "0 5px",
                    overflow: "hidden", cursor: readOnly ? "default" : "pointer",
                    zIndex: conflict ? 2 : 1,
                    display: "flex", flexDirection: "column", justifyContent: "center", gap: 1,
                    lineHeight: 1.15,
                  }}>
                  <span style={{ fontSize: 11, fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {conflict ? "⚠ " : ""}{teams.map(teamName).join(" + ")}
                  </span>
                  {tall && (
                    <span style={{ fontSize: 9.5, opacity: 0.75, whiteSpace: "nowrap" }}>
                      {fmtRange(s, e)}
                    </span>
                  )}
                </button>
              );
            })
          )}
        </div>
      </div>

      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", padding: "9px 14px", borderTop: `1px solid ${C.borderLight}`, fontSize: 11, color: C.textMuted, alignItems: "center" }}>
        {LEVELS.map(l => (
          <span key={l} style={{ display: "flex", alignItems: "center", gap: 5 }}>
            <LevelSwatch level={l} /> {l}
          </span>
        ))}
        <span style={{ marginLeft: "auto", fontSize: 10.5 }}>Blocks are coloured by level · click one to edit, click open ice to add</span>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════
// EXPORTS
// All generated in the browser, no server. The .ics turns the weekly
// template into repeating calendar events, so a coach subscribes once and
// stops asking.
// ══════════════════════════════════════════════════
function downloadBlob(filename, text, mime = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type: `${mime};charset=utf-8` }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// The two places the app touches real dates, both for the .ics only.
function shiftISO(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d, 12);
  dt.setDate(dt.getDate() + days);
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
}
function firstDateForDay(day) {
  // SEASON_FIRST_MONDAY is a Monday, so Sunday is six days later.
  return shiftISO(SEASON_FIRST_MONDAY, day === 0 ? 6 : day - 1);
}

function exportCSV(assignments, { teams, rinks }) {
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const rows = [["Day", "Rink", "Start", "End", "Minutes", "Teams", "Age", "Level", "Type", "Shared", "Ice quality"]];
  const sorted = [...assignments].sort((a, b) =>
    DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || toMin(a.start) - toMin(b.start));
  for (const a of sorted) {
    const ts = (a.teamIds || []).map(id => teamMap[id]).filter(Boolean);
    rows.push([
      DOW_LONG[a.day], rinkMap[a.rinkId]?.name || a.rinkId,
      a.start, a.end, String(toMin(a.end) - toMin(a.start)),
      ts.map(teamName).join(" + "),
      ts.map(t => AGE_MAP[t.ageGroup]?.label || "").join(" + "),
      ts.map(t => t.level).join(" + "),
      SESSION_KIND_MAP[a.kind]?.label || "Practice",
      ts.length > 1 ? "Yes" : "No",
      QUALITY_LABEL[slotQuality(a.day, toMin(a.start))],
    ]);
  }
  const csv = rows.map(r => r.map(c => /[",\n]/.test(c) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n");
  downloadBlob(`ice-schedule-${SEASON_LABEL.replace("–", "-")}.csv`, csv, "text/csv");
}

function exportICS(assignments, { teams, rinks, teamFilter }) {
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const pad = n => String(n).padStart(2, "0");
  const stampNow = (d => `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`)(new Date());
  // Floating local times — every ice time is local to its rink, and
  // floating means the calendar shows exactly what's written.
  const local = (iso, min) => `${iso.replace(/-/g, "")}T${toHHMM(min).replace(":", "")}00`;
  const until = `${SEASON_LAST_DATE.replace(/-/g, "")}T235900Z`;

  const list = teamFilter ? assignments.filter(a => (a.teamIds || []).includes(teamFilter)) : assignments;
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Wild Ice Scheduler//EN", "CALSCALE:GREGORIAN",
    `X-WR-CALNAME:Ice schedule ${SEASON_LABEL}${teamFilter ? " — " + teamName(teamMap[teamFilter]) : ""}`];
  for (const a of list) {
    const names = (a.teamIds || []).map(id => teamName(teamMap[id])).join(" + ");
    const rink = rinkMap[a.rinkId]?.name || "Rink";
    const iso = firstDateForDay(a.day);
    lines.push(
      "BEGIN:VEVENT",
      `UID:${a.id}@wildicescheduler`,
      `DTSTAMP:${stampNow}`,
      `DTSTART:${local(iso, toMin(a.start))}`,
      `DTEND:${local(iso, toMin(a.end))}`,
      `RRULE:FREQ=WEEKLY;UNTIL=${until}`,
      `SUMMARY:${names} — ${SESSION_KIND_MAP[a.kind]?.label || "Practice"}`,
      `LOCATION:${rink}`,
      `DESCRIPTION:${fmtDur(toMin(a.end) - toMin(a.start))} at ${rink}${(a.teamIds || []).length > 1 ? " (shared ice)" : ""}`,
      "END:VEVENT",
    );
  }
  lines.push("END:VCALENDAR");
  const who = teamFilter ? teamName(teamMap[teamFilter]).replace(/[^\w]+/g, "-").toLowerCase() : "all";
  downloadBlob(`ice-${who}.ics`, lines.join("\r\n"), "text/calendar");
}

function exportPrintable(assignments, { teams, rinks }) {
  const teamMap = Object.fromEntries(teams.map(t => [t.id, t]));
  const rinkMap = Object.fromEntries(rinks.map(r => [r.id, r]));
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const body = DAYS.map(day => {
    const list = assignments.filter(a => a.day === day).sort((x, y) => toMin(x.start) - toMin(y.start));
    if (!list.length) return `<section><h2>${esc(DOW_LONG[day])}</h2><p class="none">No ice.</p></section>`;
    const rows = list.map(a => {
      const ts = (a.teamIds || []).map(id => teamMap[id]);
      const c = levelColor(ts[0]?.level);
      return `<tr>
        <td class="t">${esc(fmtRange(toMin(a.start), toMin(a.end)))}</td>
        <td>${esc(rinkMap[a.rinkId]?.short || "")}</td>
        <td class="team"><span class="sw" style="background:${c.bg};border-color:${c.border}"></span>${esc(ts.map(teamName).join(" + "))}</td>
      </tr>`;
    }).join("");
    return `<section><h2>${esc(DOW_LONG[day])}</h2><table>${rows}</table></section>`;
  }).join("");
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ice schedule ${esc(SEASON_LABEL)}</title>
<style>
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;color:#1f2a37;margin:24px;max-width:720px}
  h1{font-family:Georgia,serif;font-size:22px;margin-bottom:2px}
  .sub{color:#68758a;font-size:12px;margin-bottom:20px}
  section{margin-bottom:16px;break-inside:avoid}
  h2{font-size:14px;border-bottom:2px solid #1f2a37;padding-bottom:3px;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:4px 6px;border-bottom:1px solid #eee}
  td.t{white-space:nowrap;width:120px;color:#555}
  td.team{font-weight:600}
  .sw{display:inline-block;width:9px;height:9px;border-radius:2px;border:1px solid;margin-right:6px}
  .none{color:#9aa6b6;font-size:12px}
  @media print{body{margin:0}}
</style></head><body>
<h1>Ice schedule</h1><div class="sub">${esc(SEASON_LABEL)} weekly template · generated ${esc(new Date().toLocaleDateString())}</div>
${body}
</body></html>`;
  downloadBlob(`ice-schedule-${SEASON_LABEL.replace("–", "-")}.html`, html, "text/html");
}

// EDIT MODALS
// Both of these refuse to save an overlap. The brief's requirement is that
// a double-booking is structurally impossible rather than something caught
// by eye, so the check runs live as the times are picked, names the
// booking in the way, and disables Save until it's resolved.

function ConflictNotice({ conflict, teamMap, label = "Conflicts with" }) {
  if (!conflict) return null;
  return (
    <div style={{ display: "flex", alignItems: "flex-start", gap: 7, background: C.redLight, color: C.redText, fontSize: 12, padding: "9px 11px", borderRadius: 7, marginBottom: 10, lineHeight: 1.45 }}>
      <span style={{ fontWeight: 700 }}>⚠</span>
      <span>{label} <strong>{describeAssignment(conflict, teamMap)}</strong> on the same sheet. Pick another time, or move that booking first.</span>
    </div>
  );
}

function AssignModal({ slot, startAt, teams, teamMap, rules, assignments, rinks, onAssign, onClose }) {
  const [teamId, setTeamId] = useState("");
  const [start, setStart] = useState(startAt);
  const [dur, setDur] = useState(null);

  const team = teamMap[teamId];
  const rule = team ? windowFor(rules, team.ageGroup, slot.day) : null;
  const duration = dur ?? rule?.duration ?? 60;
  const end = start + duration;

  const slotStart = toMin(slot.start), slotEnd = toMin(slot.end);
  const startOptions = useMemo(() => {
    const out = [];
    for (let t = slotStart; t + duration <= slotEnd; t += STEP) out.push(t);
    if (!out.includes(start)) out.push(start);
    return out.sort((a, b) => a - b);
  }, [slotStart, slotEnd, duration, start]);

  const rinkConflict = findRinkConflict(assignments, { rinkId: slot.rinkId, day: slot.day, start, end });
  const teamConflict = team ? findTeamConflict(assignments, [teamId], { day: slot.day, start, end }) : null;
  const outsideSlot = start < slotStart || end > slotEnd;
  const windowWarn = team && rule && (start < rule.earliest || start > rule.latest);
  const blocked = !team || !!rinkConflict || !!teamConflict || outsideSlot;

  // Teams are listed with the reason they can't take this ice, rather than
  // being hidden — a scheduler needs to know *why* the obvious answer is
  // unavailable.
  const options = useMemo(() => teams.map(t => {
    const w = windowFor(rules, t.ageGroup, slot.day);
    const reasons = [];
    if ((t.blackoutDows || []).includes(slot.day)) reasons.push(`doesn't skate ${DOW_SHORT[slot.day]}`);
    if (findTeamConflict(assignments, [t.id], { day: slot.day, start, end })) reasons.push("already on the ice then");
    return { team: t, ok: reasons.length === 0, why: reasons[0] || `${fmtDur(w.duration)} ice`, w };
  }), [teams, rules, slot, assignments, start, end]);

  return (
    <Modal title="Add ice time" width={500} onClose={onClose}
      subtitle={`${rinks.find(r => r.id === slot.rinkId)?.name} · ${DOW_LONG[slot.day]} · window ${fmtRange(slotStart, slotEnd)}`}
      footer={<>
        <div style={{ flex: 1 }} />
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button disabled={blocked}
          onClick={() => onAssign({ teamId, start, end })}
          style={{ ...primaryBtn(), opacity: blocked ? 0.45 : 1, cursor: blocked ? "not-allowed" : "pointer" }}>
          Add ice time
        </button>
      </>}>
      <Field label="Team">
        <div style={{ maxHeight: 210, overflowY: "auto", border: `1px solid ${C.border}`, borderRadius: 8 }}>
          {options.map(o => (
            <div key={o.team.id} onClick={() => { if (o.ok) { setTeamId(o.team.id); setDur(null); } }} style={{
              padding: "7px 11px", display: "flex", alignItems: "center", gap: 8,
              cursor: o.ok ? "pointer" : "not-allowed",
              background: teamId === o.team.id ? C.accentLight : "transparent",
              borderBottom: `1px solid ${C.borderLight}`, opacity: o.ok ? 1 : 0.5,
            }}>
              <LevelSwatch level={o.team.level} />
              <span style={{ fontSize: 13, fontWeight: 500 }}>{teamName(o.team)}</span>
              <AgeChip ageGroup={o.team.ageGroup} />
              <span style={{ marginLeft: "auto", fontSize: 11, color: o.ok ? C.textMuted : C.redText }}>{o.why}</span>
            </div>
          ))}
        </div>
      </Field>

      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Start" style={{ flex: 1 }}>
          <select value={start} onChange={e => setStart(Number(e.target.value))} style={{ ...inputStyle, width: "100%" }}>
            {startOptions.map(t => <option key={t} value={t}>{fmtTime(t)}</option>)}
          </select>
        </Field>
        <Field label="Length" style={{ flex: 1 }}>
          <select value={duration} onChange={e => setDur(Number(e.target.value))} style={{ ...inputStyle, width: "100%" }}>
            {[30, 45, 50, 60, 75, 80, 90, 105, 120].map(n => <option key={n} value={n}>{fmtDur(n)}</option>)}
          </select>
        </Field>
      </div>
      <div style={{ fontSize: 12, color: C.textMuted, marginBottom: 12 }}>{fmtRange(start, end)}</div>

      <ConflictNotice conflict={rinkConflict} teamMap={teamMap} />
      {teamConflict && (
        <div style={{ background: C.redLight, color: C.redText, fontSize: 12, padding: "9px 11px", borderRadius: 7, marginBottom: 10 }}>
          ⚠ {teamName(team)} is already on the ice at that time.
        </div>
      )}
      {outsideSlot && (
        <div style={{ background: C.redLight, color: C.redText, fontSize: 12, padding: "9px 11px", borderRadius: 7, marginBottom: 10 }}>
          ⚠ That runs outside the rink's window of {fmtRange(slotStart, slotEnd)}.
        </div>
      )}
      {windowWarn && !blocked && (
        <div style={{ background: C.orangeLight, color: C.orangeText, fontSize: 12, padding: "9px 11px", borderRadius: 7, marginBottom: 10, lineHeight: 1.45 }}>
          Outside the usual {AGE_MAP[team.ageGroup]?.label} start window ({fmtTime(rule.earliest)}–{fmtTime(rule.latest)} on a {dayTypeOf(slot.day)}). Allowed, but it'll show as a warning.
        </div>
      )}
    </Modal>
  );
}

function IceTimeModal({ assignment, teams, teamMap, rinks, slots, rules, assignments, onSave, onDelete, onClose }) {
  const [draft, setDraft] = useState(() => ({ ...assignment, teamIds: [...(assignment.teamIds || [])] }));
  const slot = slots.find(s => s.id === draft.slotId);
  const primary = teamMap[draft.teamIds[0]];
  const second = teamMap[draft.teamIds[1]];

  const start = toMin(draft.start), end = toMin(draft.end);
  const dur = end - start;
  const slotStart = slot ? toMin(slot.start) : start;
  const slotEnd = slot ? toMin(slot.end) : end;

  const startOptions = useMemo(() => {
    const out = [];
    for (let t = slotStart; t + dur <= slotEnd; t += STEP) out.push(t);
    if (!out.includes(start)) out.push(start);
    return out.sort((a, b) => a - b);
  }, [slotStart, slotEnd, dur, start]);

  const rinkConflict = findRinkConflict(assignments, { rinkId: draft.rinkId, day: draft.day, start, end }, draft.id);
  const teamConflict = findTeamConflict(assignments, draft.teamIds, { day: draft.day, start, end }, draft.id);
  const outsideSlot = slot && (start < slotStart || end > slotEnd);
  const blocked = !!rinkConflict || !!teamConflict || !!outsideSlot || !draft.teamIds.length;

  const shareable = primary ? teams.filter(t => t.id !== primary.id && canShare(rules, primary, t)) : [];
  const rule = primary ? windowFor(rules, primary.ageGroup, draft.day) : null;
  const windowWarn = rule && (start < rule.earliest || start > rule.latest);

  const setTimes = (s, d) => setDraft(x => ({ ...x, start: toHHMM(s), end: toHHMM(s + d) }));

  return (
    <Modal title="Ice time" width={480} onClose={onClose}
      subtitle={`${rinks.find(r => r.id === draft.rinkId)?.name} · ${DOW_LONG[draft.day]}`}
      footer={<>
        <button onClick={() => onDelete(draft.id)} style={dangerBtn()}>Remove</button>
        <div style={{ flex: 1 }} />
        <button onClick={onClose} style={btn()}>Cancel</button>
        <button disabled={blocked} onClick={() => onSave({ ...draft, shared: draft.teamIds.length > 1 })}
          style={{ ...primaryBtn(), opacity: blocked ? 0.45 : 1, cursor: blocked ? "not-allowed" : "pointer" }}>Save</button>
      </>}>
      <Field label="Team">
        <select value={draft.teamIds[0] || ""} onChange={e => setDraft(d => ({ ...d, teamIds: [e.target.value, ...d.teamIds.slice(1)] }))} style={{ ...inputStyle, width: "100%" }}>
          {teams.map(t => <option key={t.id} value={t.id}>{teamName(t)}</option>)}
        </select>
      </Field>

      <Field label="Sharing this ice" hint={shareable.length ? "House-league teams can double up on one sheet." : "No team is set up to share with this one."}>
        {second ? (
          <div style={{ display: "flex", gap: 8 }}>
            <select value={draft.teamIds[1]} onChange={e => setDraft(d => ({ ...d, teamIds: [d.teamIds[0], e.target.value] }))} style={{ ...inputStyle, flex: 1 }}>
              {shareable.map(t => <option key={t.id} value={t.id}>{teamName(t)}</option>)}
            </select>
            <button onClick={() => setDraft(d => ({ ...d, teamIds: [d.teamIds[0]] }))} style={smallBtn()}>Remove</button>
          </div>
        ) : (
          <button disabled={!shareable.length}
            onClick={() => setDraft(d => ({ ...d, teamIds: [d.teamIds[0], shareable[0].id] }))}
            style={{ ...btn(), opacity: shareable.length ? 1 : 0.45 }}>+ Share with another team</button>
        )}
      </Field>

      <div style={{ display: "flex", gap: 10 }}>
        <Field label="Start" style={{ flex: 1 }}>
          <select value={start} onChange={e => setTimes(Number(e.target.value), dur)} style={{ ...inputStyle, width: "100%" }}>
            {startOptions.map(t => <option key={t} value={t}>{fmtTime(t)}</option>)}
          </select>
        </Field>
        <Field label="Length" style={{ flex: 1 }}>
          <select value={dur} onChange={e => setTimes(start, Number(e.target.value))} style={{ ...inputStyle, width: "100%" }}>
            {[30, 45, 50, 60, 75, 80, 90, 105, 120].map(n => <option key={n} value={n}>{fmtDur(n)}</option>)}
          </select>
        </Field>
      </div>

      <Field label="Type">
        <div style={{ display: "flex", gap: 6 }}>
          {SESSION_KINDS.map(k => (
            <button key={k.id} onClick={() => setDraft(d => ({ ...d, kind: k.id }))} style={{
              ...chipStyle, flex: 1,
              background: draft.kind === k.id ? C.accent : C.surface,
              color: draft.kind === k.id ? C.onAccent : C.text,
              borderColor: draft.kind === k.id ? C.accent : C.border,
            }}>{k.label}</button>
          ))}
        </div>
      </Field>

      <ConflictNotice conflict={rinkConflict} teamMap={teamMap} />
      {teamConflict && (
        <div style={{ background: C.redLight, color: C.redText, fontSize: 12, padding: "9px 11px", borderRadius: 7, marginBottom: 10 }}>
          ⚠ {teamName(teamMap[teamConflict.teamId])} is already on the ice at that time.
        </div>
      )}
      {outsideSlot && (
        <div style={{ background: C.redLight, color: C.redText, fontSize: 12, padding: "9px 11px", borderRadius: 7, marginBottom: 10 }}>
          ⚠ That runs outside the rink's window of {fmtRange(slotStart, slotEnd)}.
        </div>
      )}
      {windowWarn && !blocked && (
        <div style={{ background: C.orangeLight, color: C.orangeText, fontSize: 12, padding: "9px 11px", borderRadius: 7, marginBottom: 10, lineHeight: 1.45 }}>
          Outside the usual {AGE_MAP[primary.ageGroup]?.label} start window ({fmtTime(rule.earliest)}–{fmtTime(rule.latest)}). Allowed, but flagged.
        </div>
      )}
    </Modal>
  );
}

// The one health indicator for the schedule: colour and count in the
// toolbar, detail on click. Replaces what used to be two separate
// full-width banners stacked above the grid.
function statusTone(issues, conflicts) {
  const errors = issues.filter(i => i.severity === "error").length;
  const warns = issues.filter(i => i.severity === "warn").length;
  if (conflicts.length) return { key: "conflict", fg: C.redText, bg: C.redLight, dot: C.red, label: `${conflicts.length} double-booked` };
  if (errors) return { key: "error", fg: C.redText, bg: C.redLight, dot: C.red, label: `${errors} problem${errors === 1 ? "" : "s"}` };
  if (warns) return { key: "warn", fg: C.orangeText, bg: C.orangeLight, dot: C.orange, label: `${warns} to review` };
  return { key: "ok", fg: C.greenText, bg: C.greenLight, dot: C.green, label: "All clear" };
}

function StatusPanel({ issues, conflicts, teamMap, rinkMap, onOpenAssignment, close }) {
  return (
    <div style={{ maxHeight: 340, overflowY: "auto" }}>
      {!!conflicts.length && (
        <div style={{ background: C.redLight, padding: "10px 12px", borderBottom: `1px solid ${C.border}` }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.redText, marginBottom: 6 }}>
            ⚠ {conflicts.length} double-booked slot{conflicts.length > 1 ? "s" : ""}
          </div>
          <div style={{ fontSize: 11, color: C.redText, marginBottom: 7, lineHeight: 1.45 }}>
            These came from stored data — new ones can't be saved. Click to open one.
          </div>
          {conflicts.map(([a], i) => (
            <button key={i} onClick={() => { onOpenAssignment(a); close(); }} style={{
              display: "block", background: "none", border: "none", padding: "2px 0",
              color: C.redText, fontWeight: 700, textDecoration: "underline",
              cursor: "pointer", fontSize: 12, fontFamily: FONT, textAlign: "left",
            }}>
              {rinkMap[a.rinkId]?.short} {DOW_SHORT[a.day]} {fmtTime(toMin(a.start))} — {describeAssignment(a, teamMap)}
            </button>
          ))}
        </div>
      )}
      <div style={{ padding: "6px 12px 8px" }}>
        {!issues.length && <div style={{ fontSize: 12, color: C.textMuted, padding: "6px 0" }}>Nothing to report.</div>}
        {issues.map((iss, i) => {
          const c = iss.severity === "error" ? C.redText : iss.severity === "warn" ? C.orangeText : C.textMuted;
          return (
            <div key={i} style={{ display: "flex", gap: 8, alignItems: "flex-start", padding: "5px 0", borderBottom: i < issues.length - 1 ? `1px solid ${C.borderLight}` : "none" }}>
              <span style={{ fontSize: 9.5, fontWeight: 700, color: c, minWidth: 36, paddingTop: 2 }}>{iss.severity.toUpperCase()}</span>
              <span style={{ fontSize: 12, color: C.text, lineHeight: 1.45 }}>{iss.message}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// Every team's week, the view that gets screenshotted into a team chat.
function TeamWeekView({ assignments, teams, rinkMap, onExportTeam }) {
  const byLevel = useMemo(() => {
    const map = {};
    for (const t of teams) (map[t.level] = map[t.level] || []).push(t);
    return map;
  }, [teams]);
  return (
    <SectionCard title="By team" subtitle="The ⤓ button downloads that team's calendar subscription file." pad={0}>
      <div style={{ overflowX: "auto" }}>
        <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 760 }}>
          <thead>
            <tr>
              <th style={{ ...thStyle, textAlign: "left", position: "sticky", left: 0, background: C.surfaceAlt, zIndex: 1 }}>Team</th>
              {DAYS.map(d => <th key={d} style={{ ...thStyle }}>{DOW_SHORT[d]}</th>)}
              <th style={{ ...thStyle }}>Weekly</th>
            </tr>
          </thead>
          <tbody>
            {LEVELS.filter(l => byLevel[l]?.length).map(level => (
              <React.Fragment key={level}>
                <tr>
                  <td colSpan={DAYS.length + 2} style={{ padding: "5px 10px", background: levelColor(level).bg, color: levelColor(level).text, fontSize: 11, fontWeight: 700, borderBottom: `1px solid ${C.borderLight}` }}>
                    {level}
                  </td>
                </tr>
                {byLevel[level].map(t => {
                  const mine = assignments.filter(x => (x.teamIds || []).includes(t.id));
                  const total = mine.reduce((n, x) => n + toMin(x.end) - toMin(x.start), 0);
                  return (
                    <tr key={t.id}>
                      <td style={{ ...tdStyle, textAlign: "left", fontWeight: 600, fontSize: 12, position: "sticky", left: 0, background: C.surface }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <span>{teamName(t)}</span>
                          {!!mine.length && (
                            <button title={`Download ${teamName(t)}'s calendar`} onClick={() => onExportTeam(t.id)}
                              style={{ ...smallBtn(), padding: "1px 6px", fontSize: 11, lineHeight: 1.4 }}>⤓</button>
                          )}
                        </div>
                      </td>
                      {DAYS.map(d => {
                        const day = mine.filter(x => x.day === d).sort((p, q) => toMin(p.start) - toMin(q.start));
                        return (
                          <td key={d} style={{ ...tdStyle, textAlign: "center", fontSize: 11 }}>
                            {day.length ? day.map(x => (
                              <div key={x.id} style={{ marginBottom: 2 }}>
                                <div style={{ fontWeight: 600 }}>{fmtRange(toMin(x.start), toMin(x.end))}</div>
                                <div style={{ color: C.textMuted, fontSize: 10 }}>{rinkMap[x.rinkId]?.short}</div>
                              </div>
                            )) : <span style={{ color: C.textLight }}>—</span>}
                          </td>
                        );
                      })}
                      <td style={{ ...tdStyle, textAlign: "center", fontSize: 12, fontWeight: 600, color: total ? C.text : C.textLight }}>
                        {total ? fmtDur(total) : "—"}
                      </td>
                    </tr>
                  );
                })}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>
    </SectionCard>
  );
}

  const [swapPick, setSwapPick] = useState(null);
  const [swapError, setSwapError] = useState("");
  const [openAssign, setOpenAssign] = useState(null);
  const [openIceTime, setOpenIceTime] = useState(null);
  const [history, setHistory] = useState([]);
  const [future, setFuture] = useState([]);
  const baselineRef = useRef(null);

  const teamMap = useMemo(() => Object.fromEntries(teams.map(t => [t.id, t])), [teams]);
  const rinkMap = useMemo(() => Object.fromEntries(rinks.map(r => [r.id, r])), [rinks]);
  if (baselineRef.current === null) baselineRef.current = assignments.map(a => ({ ...a }));

  const conflicts = useMemo(() => scanConflicts(assignments), [assignments]);
  const conflictIds = useMemo(() => {
    const s = new Set();
    for (const [a, b] of conflicts) { s.add(a.id); s.add(b.id); }
    return s;
  }, [conflicts]);

  const issues = useMemo(
    () => validateSchedule({ assignments, teams, slots, rinks, rules }),
    [assignments, teams, slots, rinks, rules]
  );

  const commit = next => {
    setHistory(h => [...h, assignments.map(a => ({ ...a }))]);
    setFuture([]);
    setAssignments(next);
  };
  const undo = () => {
    if (!history.length) return;
    setFuture(f => [...f, assignments.map(a => ({ ...a }))]);
    setAssignments(history[history.length - 1]);
    setHistory(h => h.slice(0, -1));
  };
  const redo = () => {
    if (!future.length) return;
    setHistory(h => [...h, assignments.map(a => ({ ...a }))]);
    setAssignments(future[future.length - 1]);
    setFuture(f => f.slice(0, -1));
  };

  const handleBlockClick = a => {
    if (isPublished) return;
    setSwapError("");
    if (!swapMode) { setOpenIceTime(a); return; }
    if (!swapPick) { setSwapPick(a.id); return; }
    if (swapPick === a.id) { setSwapPick(null); return; }
    const other = assignments.find(x => x.id === swapPick);
    if (!other) { setSwapPick(null); return; }

    // The ice stays put; the teams trade places. That can't create a rink
    // clash, but it can put a team in two places at once — so check before
    // committing rather than leaving a mess to find later.
    const rest = assignments.filter(x => x.id !== a.id && x.id !== other.id);
    const clashA = findTeamConflict(rest, other.teamIds, { day: a.day, start: toMin(a.start), end: toMin(a.end) });
    const clashB = findTeamConflict(rest, a.teamIds, { day: other.day, start: toMin(other.start), end: toMin(other.end) });
    if (clashA || clashB) {
      const who = clashA ? teamMap[clashA.teamId] : teamMap[clashB.teamId];
      setSwapError(`Can't swap — ${teamName(who)} would be in two places at once.`);
      setSwapPick(null);
      return;
    }
    commit(assignments.map(x =>
      x.id === a.id     ? { ...x, teamIds: other.teamIds, kind: other.kind, shared: other.teamIds.length > 1 } :
      x.id === other.id ? { ...x, teamIds: a.teamIds, kind: a.kind, shared: a.teamIds.length > 1 } : x
    ));
    setSwapPick(null);
  };

  const stats = useMemo(() => {
    let purchased = 0, booked = 0;
    for (const s of slots) {
      if (s.blocked) continue;
      purchased += toMin(s.end) - toMin(s.start);
      booked += slotUtilization(s, assignments).booked;
    }
    return { purchased, booked, pct: purchased ? Math.round(booked / purchased * 100) : 0, count: assignments.length };
  }, [slots, assignments]);

  return (
    <div>
      {seedBannerOpen && (
        <div style={{ background: C.blueLight, border: `1px solid ${C.blue}`, borderRadius: 8, padding: "7px 12px", marginBottom: 10, display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", fontSize: 12, color: C.blueText }}>
          <span style={{ flex: "1 1 320px", lineHeight: 1.45 }}>
            <strong>Transcribed from the spreadsheet</strong> — rinks and teams should be right, individual
            bookings were read off a screenshot and need checking.
          </span>
          <button onClick={onDismissSeedBanner} style={{ ...smallBtn(), borderColor: C.blue, color: C.blueText }}>Got it</button>
        </div>
      )}

      {/* ── One toolbar: view, editing, health, sharing, publishing.
          Sticky so it stays reachable while the grid scrolls. ── */}
      <div style={{
        position: "sticky", top: 0, zIndex: 30,
        background: C.surface, border: `1px solid ${isPublished ? C.blue : C.border}`,
        borderRadius: 10, padding: "8px 10px", marginBottom: 12,
        boxShadow: "0 2px 8px rgba(10,20,35,0.07)",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 7, flexWrap: "wrap" }}>
          {/* view */}
          <div style={{ display: "flex", borderRadius: 6, overflow: "hidden", border: `1px solid ${C.border}` }}>
            {[["grid", "Grid"], ["teams", "By team"]].map(([v, label]) => (
              <button key={v} onClick={() => setView(v)} style={{
                background: view === v ? C.accent : C.surface,
                color: view === v ? C.onAccent : C.textMuted,
                border: "none", padding: "6px 11px", fontFamily: FONT, fontSize: 12,
                fontWeight: view === v ? 600 : 500, cursor: "pointer",
              }}>{label}</button>
            ))}
          </div>

          <span style={{ width: 1, height: 20, background: C.borderLight }} />

          {/* editing */}
          <button onClick={() => { setSwapMode(m => !m); setSwapPick(null); setSwapError(""); }} disabled={isPublished} style={{
            ...smallBtn(), opacity: isPublished ? 0.45 : 1,
            background: swapMode ? C.accent : C.surface, color: swapMode ? C.onAccent : C.text,
            borderColor: swapMode ? C.accent : C.border, fontWeight: swapMode ? 600 : 500,
          }}>{swapMode ? "Swapping…" : "Swap"}</button>
          <button onClick={undo} disabled={!history.length || isPublished} title="Undo"
            style={{ ...smallBtn(), opacity: (!history.length || isPublished) ? 0.4 : 1 }}>↶</button>
          <button onClick={redo} disabled={!future.length || isPublished} title="Redo"
            style={{ ...smallBtn(), opacity: (!future.length || isPublished) ? 0.4 : 1 }}>↷</button>
          <button onClick={() => commit(baselineRef.current.map(a => ({ ...a })))} disabled={isPublished}
            style={{ ...smallBtn(), opacity: isPublished ? 0.45 : 1 }}>Reset</button>

          {/* stats, demoted */}
          <span style={{ marginLeft: "auto", fontSize: 11.5, color: C.textMuted, whiteSpace: "nowrap" }}>
            {stats.count} ice times · {stats.pct}% of {fmtDur(stats.purchased)}
          </span>

          {/* health */}
          <Menu width={340} trigger={(toggle, open) => {
            const tone = statusTone(issues, conflicts);
            return (
              <button onClick={toggle} style={{
                ...smallBtn(), background: tone.bg, borderColor: tone.dot, color: tone.fg,
                fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 6,
              }}>
                <span style={{ width: 7, height: 7, borderRadius: "50%", background: tone.dot }} />
                {tone.label}
                <span style={{ opacity: 0.7 }}>{open ? "▴" : "▾"}</span>
              </button>
            );
          }}>
            {close => (
              <StatusPanel issues={issues} conflicts={conflicts} teamMap={teamMap} rinkMap={rinkMap}
                onOpenAssignment={a => setOpenIceTime(a)} close={close} />
            )}
          </Menu>

          {/* sharing */}
          <Menu width={260} trigger={(toggle) => (
            <button onClick={toggle} title="Share this schedule" aria-label="Share this schedule"
              style={{ ...smallBtn(), padding: "6px 9px", display: "inline-flex", alignItems: "center", color: C.textMuted }}>
              <ShareIcon />
            </button>
          )}>
            {close => (
              <div>
                <div style={{ padding: "8px 12px", borderBottom: `1px solid ${C.borderLight}`, fontSize: 11, fontWeight: 700, color: C.textMuted }}>SHARE</div>
                <MenuItem onClick={() => { exportPrintable(assignments, { teams, rinks }); close(); }} hint="For the arena office wall">Printable sheet</MenuItem>
                <MenuItem onClick={() => { exportCSV(assignments, { teams, rinks }); close(); }} hint="For invoicing or the board">CSV</MenuItem>
                <MenuItem onClick={() => { exportICS(assignments, { teams, rinks }); close(); }} hint={`Repeats weekly through ${SEASON_LABEL} — subscribe once`}>Calendar (.ics)</MenuItem>
                <div style={{ padding: "8px 12px", fontSize: 11, color: C.textLight, lineHeight: 1.45 }}>
                  Generated in the browser — nothing is uploaded.
                </div>
              </div>
            )}
          </Menu>

          <button onClick={onTogglePublish} style={isPublished ? { ...smallBtn(), borderColor: C.blue, color: C.blueText, fontWeight: 600 } : { ...smallBtn(), ...primaryBtn(), padding: "5px 12px", fontSize: 12 }}>
            {isPublished ? "Published ✓" : "Publish"}
          </button>
        </div>

        {(swapMode || swapError) && (
          <div style={{ marginTop: 7, paddingTop: 7, borderTop: `1px solid ${C.borderLight}`, fontSize: 12, color: swapError ? C.redText : C.textMuted }}>
            {swapError || (swapPick ? "Now tap the ice time to swap it with." : "Tap two ice times to trade the teams between them.")}
          </div>
        )}
        {isPublished && !swapMode && !swapError && (
          <div style={{ marginTop: 7, paddingTop: 7, borderTop: `1px solid ${C.borderLight}`, fontSize: 12, color: C.blueText }}>
            Coaches are looking at this. Unpublish to make changes.
          </div>
        )}
      </div>

      {view === "grid" ? (
        <ScheduleGrid
          slots={slots} assignments={assignments} rinks={rinks} teamMap={teamMap} rules={rules}
          conflictIds={conflictIds} swapPick={swapPick} readOnly={isPublished}
          onBlockClick={handleBlockClick}
          onEmptyClick={(slot, m) => setOpenAssign({ slot, startAt: m })} />
      ) : (
        <TeamWeekView assignments={assignments} teams={teams} rinkMap={rinkMap}
          onExportTeam={tid => exportICS(assignments, { teams, rinks, teamFilter: tid })} />
      )}

      {openAssign && (
        <AssignModal slot={openAssign.slot} startAt={openAssign.startAt} teams={teams} teamMap={teamMap}
          rules={rules} assignments={assignments} rinks={rinks} onClose={() => setOpenAssign(null)}
          onAssign={({ teamId, start, end }) => {
            commit([...assignments, {
              id: uid("ice"), slotId: openAssign.slot.id, rinkId: openAssign.slot.rinkId,
              day: openAssign.slot.day, start: toHHMM(start), end: toHHMM(end),
              teamIds: [teamId], kind: "practice", shared: false,
            }]);
            setOpenAssign(null);
          }} />
      )}
      {openIceTime && (
        <IceTimeModal assignment={openIceTime} teams={teams} teamMap={teamMap} rinks={rinks} slots={slots}
          rules={rules} assignments={assignments} onClose={() => setOpenIceTime(null)}
          onSave={next => { commit(assignments.map(a => a.id === next.id ? next : a)); setOpenIceTime(null); }}
          onDelete={id => { commit(assignments.filter(a => a.id !== id)); setOpenIceTime(null); }} />
      )}
    </div>
  );
}

// The rink windows: which sheets are available, which day, what hours.
// Everything else is scheduled inside these.
